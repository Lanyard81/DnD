    openModal(`
      <h2>${existing ? 'Edit' : 'New'} Journal Entry</h2>
      <div class="field"><label>Title</label><input type="text" id="jTitle" value="${escapeHtml(data.title)}"></div>
      <div class="field"><label>Body (Markdown)</label><textarea id="jBody" style="min-height:8em">${escapeHtml(data.body)}</textarea></div>
      <div class="field row between" style="align-items:center">
        <label style="margin:0">DM only (hidden from players)</label>
        <button class="btn sm ${data.isPrivateDM ? 'primary' : ''}" id="jPrivate">${data.isPrivateDM ? 'Yes' : 'No'}</button>
      </div>
      <div class="row" style="margin-top:1rem">
        <button class="btn block" id="jCancel">Cancel</button>
        <button class="btn primary block" id="jSave">Save</button>
      </div>
    `, (rootEl) => {
      let priv = data.isPrivateDM;
      rootEl.querySelector('#jPrivate').onclick = (e) => { priv = !priv; e.target.textContent = priv ? 'Yes' : 'No'; e.target.classList.toggle('primary', priv); };
      rootEl.querySelector('#jCancel').onclick = closeModal;
      rootEl.querySelector('#jSave').onclick = async () => {
        data.title = rootEl.querySelector('#jTitle').value.trim() || 'Untitled';
        data.body = rootEl.querySelector('#jBody').value;
        data.isPrivateDM = priv;
        await DB.put('journal_entries', data);
        closeModal();
        render();
      };
    });
  }

  async function renderLore(body) {
    const allPages = (await DB.getAllByIndex('lore_pages', 'campaignId', campaignId)).sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    const lq = loreSearch.trim().toLowerCase();
    const pages = lq ? allPages.filter(p => p.title.toLowerCase().includes(lq) || (p.category || '').toLowerCase().includes(lq) || (p.body || '').toLowerCase().includes(lq)) : allPages;
    body.innerHTML = `
      ${allPages.length > 4 ? `<input type="search" id="loreSearch" placeholder="Search lore…" value="${escapeHtml(loreSearch)}" style="margin-bottom:.7rem">` : ''}
      ${!pages.length && lq ? emptyState('🔍', 'No matches', `Nothing matches "${loreSearch}".`) : ''}
      ${pages.map(p => `
        <div class="card">
          <div class="row between">
            <strong>${escapeHtml(p.title)}</strong>
            <button class="icon-btn" data-lore-delete="${p.id}" style="width:28px;height:28px;font-size:1rem">✕</button>
          </div>
          <p class="hint" style="margin:.2rem 0 .3rem">${escapeHtml(p.category || 'Uncategorized')}</p>
          <p style="margin:0;white-space:pre-wrap">${escapeHtml((p.body || '').slice(0, 300))}${(p.body || '').length > 300 ? '…' : ''}</p>
        </div>
      `).join('')}
      ${!allPages.length ? emptyState('🌍', 'No lore pages yet', 'Use these for locations, factions, history — anything worth remembering.') : ''}
      <button class="btn primary block" id="newLoreBtn">+ New Lore Page</button>
    `;
    const lSearchInput = body.querySelector('#loreSearch');
    if (lSearchInput) lSearchInput.oninput = async (e) => {
      loreSearch = e.target.value;
      const caret = e.target.selectionStart;
      await renderLore(body);
      const el = body.querySelector('#loreSearch');
      if (el) { el.focus(); el.setSelectionRange(caret, caret); }
    };
    body.querySelectorAll('[data-lore-delete]').forEach(el => el.onclick = async () => {
      const ok = await confirmDialog('Delete this lore page?', { okLabel: 'Delete', danger: true });
      if (!ok) return;
      await DB.delete('lore_pages', el.getAttribute('data-lore-delete'));
      render();
    });
    body.querySelector('#newLoreBtn').onclick = () => {
      openModal(`
        <h2>New Lore Page</h2>
        <div class="field"><label>Title</label><input type="text" id="lTitle"></div>
        <div class="field"><label>Category</label><input type="text" id="lCategory" placeholder="Location, faction, history…"></div>
        <div class="field"><label>Body</label><textarea id="lBody" style="min-height:8em"></textarea></div>
        <div class="row" style="margin-top:1rem">
          <button class="btn block" id="lCancel">Cancel</button>
          <button class="btn primary block" id="lSave">Save</button>
        </div>
      `, (rootEl) => {
        rootEl.querySelector('#lCancel').onclick = closeModal;
        rootEl.querySelector('#lSave').onclick = async () => {
          const title = rootEl.querySelector('#lTitle').value.trim();
          if (!title) { toast('Give the page a title.', 'danger'); return; }
          const ts = nowIso();
          await DB.put('lore_pages', { id: uid(), campaignId, title, category: rootEl.querySelector('#lCategory').value.trim(), body: rootEl.querySelector('#lBody').value, createdAt: ts, updatedAt: ts });
          closeModal();
          render();
        };
      });
    };
  }

  render();
}

/* ---- Handouts ---- */
async function ScreenHandouts(root, campaignId) {
  const campaign = await DB.get('campaigns', campaignId);
  if (!campaign) { root.innerHTML = emptyState('❓', 'Campaign not found'); return; }

  async function render() {
    const handouts = (await DB.getAllByIndex('handouts', 'campaignId', campaignId)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    root.innerHTML = `
      ${handouts.length ? handouts.map(h => `
        <div class="card">
          <div class="row between">
            <strong>${escapeHtml(h.title)}</strong>
            <div class="row" style="gap:.3rem">
              <button class="btn sm ${h.revealedToPlayer ? 'primary' : ''}" data-handout-reveal="${h.id}">${h.revealedToPlayer ? 'Revealed' : 'Hidden'}</button>
              <button class="icon-btn" data-handout-delete="${h.id}" style="width:28px;height:28px;font-size:1rem">✕</button>
            </div>
          </div>
          ${h.imageData ? `<img src="${h.imageData}" style="max-width:100%;border-radius:var(--radius);margin-top:.5rem">` : ''}
          ${h.body ? `<p style="margin:.4rem 0 0;white-space:pre-wrap">${escapeHtml(h.body)}</p>` : ''}
        </div>
      `).join('') : emptyState('🖼', 'No handouts yet', 'Add a letter, map excerpt, or portrait to show at the table.')}
      <button class="btn primary block" id="newHandoutBtn">+ New Handout</button>
    `;
    root.querySelectorAll('[data-handout-reveal]').forEach(el => el.onclick = async () => {
      const h = await DB.get('handouts', el.getAttribute('data-handout-reveal'));
      h.revealedToPlayer = !h.revealedToPlayer;
      await DB.put('handouts', h);
      render();
    });
    root.querySelectorAll('[data-handout-delete]').forEach(el => el.onclick = async () => {
      const ok = await confirmDialog('Delete this handout?', { okLabel: 'Delete', danger: true });
      if (!ok) return;
      await DB.delete('handouts', el.getAttribute('data-handout-delete'));
      render();
    });
    root.querySelector('#newHandoutBtn').onclick = () => {
      openModal(`
        <h2>New Handout</h2>
        <div class="field"><label>Title</label><input type="text" id="hTitle"></div>
        <div class="field"><label>Text</label><textarea id="hBody"></textarea></div>
        <div class="field"><label>Image (optional, kept small)</label><input type="file" id="hImage" accept="image/*"></div>
        <p class="hint">Large images bloat your campaign export — a small scan or crop works best.</p>
        <div class="row" style="margin-top:1rem">
          <button class="btn block" id="hCancel">Cancel</button>
          <button class="btn primary block" id="hSave">Save</button>
        </div>
      `, (rootEl) => {
        rootEl.querySelector('#hCancel').onclick = closeModal;
        rootEl.querySelector('#hSave').onclick = async () => {
          const title = rootEl.querySelector('#hTitle').value.trim();
          if (!title) { toast('Give the handout a title.', 'danger'); return; }
          const file = rootEl.querySelector('#hImage').files[0];
          let imageData = null;
          if (file) imageData = await new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(file); });
          await DB.put('handouts', { id: uid(), campaignId, title, body: rootEl.querySelector('#hBody').value, imageData, revealedToPlayer: false, createdAt: nowIso() });
          closeModal();
          render();
        };
      });
    };
  }

  render();
}

/* ---- XP & loot ---- */
// A simple, generic milestone table — not tied to any official progression,
// just enough to nudge "maybe it's time to level up" without blocking play.
const XP_LEVEL_THRESHOLDS = [0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000, 85000, 100000, 120000, 140000, 165000, 195000, 225000, 265000, 305000, 355000];
function levelForXp(xp) {
  let lvl = 1;
  for (let i = 0; i < XP_LEVEL_THRESHOLDS.length; i++) if (xp >= XP_LEVEL_THRESHOLDS[i]) lvl = i + 1;
  return lvl;
}

async function ScreenXpLoot(root, campaignId) {
  const campaign = await DB.get('campaigns', campaignId);
  if (!campaign) { root.innerHTML = emptyState('❓', 'Campaign not found'); return; }

  async function render() {
    const characters = await DB.getAllByIndex('characters', 'campaignId', campaignId);
    root.innerHTML = `
      <div class="section-title">XP Tracker</div>
      ${characters.map(c => {
        const suggested = levelForXp(c.xp);
        return `
        <div class="card">
          <div class="row between">
            <strong>${escapeHtml(c.name)}</strong>
            <span class="badge">Lv ${c.level}${suggested !== c.level ? ` → suggests ${suggested}` : ''}</span>
          </div>
          <div class="row" style="margin-top:.5rem;gap:.4rem;align-items:center">
            <input type="number" data-xp-add="${c.id}" placeholder="Award XP" style="width:8em">
            <button class="btn sm" data-xp-go="${c.id}">Award</button>
            ${suggested !== c.level ? `<button class="btn sm primary" data-xp-levelup="${c.id}">Level Up to ${suggested}</button>` : ''}
          </div>
          <p class="hint" style="margin-top:.3rem">${c.xp} XP total</p>
        </div>
      `; }).join('') || emptyState('⭐', 'No characters yet')}

      <div class="section-title">Loot Generator</div>
      <button class="btn block" id="rollLootBtn">🎁 Roll Loot</button>
      <div id="lootResultSlot"></div>
      ${characters.length ? `
        <div class="field" style="margin-top:.6rem">
          <label>Give to</label>
          <select id="lootGiveTo">${characters.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>
        </div>
      ` : ''}
    `;
    root.querySelectorAll('[data-xp-go]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-xp-go');
      const input = root.querySelector(`[data-xp-add="${id}"]`);
      const amount = parseInt(input.value) || 0;
      if (!amount) return;
      const c = await DB.get('characters', id);
      c.xp += amount;
      c.updatedAt = nowIso();
      await DB.put('characters', c);
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'system', text: `${c.name} gains ${amount} XP (${c.xp} total).` }));
      render();
    });
    root.querySelectorAll('[data-xp-levelup]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-xp-levelup');
      const c = await DB.get('characters', id);
      c.level = levelForXp(c.xp);
      c.proficiencyBonus = profBonusForLevel(c.level);
      c.updatedAt = nowIso();
      await DB.put('characters', c);
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'system', text: `${c.name} levels up to ${c.level}!` }));
      render();
    });
    root.querySelector('#rollLootBtn').onclick = () => {
      const loot = generateLoot();
      const slot = root.querySelector('#lootResultSlot');
      slot.innerHTML = `<div class="card"><strong>${escapeHtml(loot.name)}</strong>${loot.gold ? ` <span class="badge">${loot.gold} gp</span>` : ''}</div>`;
      slot.dataset.lootText = loot.name;
      slot.dataset.lootGold = loot.gold || 0;
      const giveBtn = document.createElement('button');
      giveBtn.className = 'btn sm block';
      giveBtn.textContent = 'Give to selected character';
      giveBtn.style.marginTop = '.4rem';
      giveBtn.onclick = async () => {
        const giveTo = root.querySelector('#lootGiveTo');
        if (!giveTo) return;
        const c = await DB.get('characters', giveTo.value);
        if (loot.gold) c.currency.gp += loot.gold;
        else c.inventory.push({ itemId: uid(), name: loot.name, qty: 1, equipped: false });
        c.updatedAt = nowIso();
        await DB.put('characters', c);
        await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'system', text: `${c.name} receives ${loot.name}${loot.gold ? ` (${loot.gold} gp)` : ''}.` }));
        toast('Given.', 'success');
      };
      slot.appendChild(giveBtn);
    };
  }

  render();
}

/* ---- Timeline (chronological view of campaign memory events) ---- */
async function ScreenTimeline(root, campaignId) {
  const campaign = await DB.get('campaigns', campaignId);
  if (!campaign) { root.innerHTML = emptyState('❓', 'Campaign not found'); return; }
  const mem = await getOrCreateCampaignMemory(campaignId);
  const events = mem.recentEventsRingBuffer.slice().sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  root.innerHTML = `
    <p class="hint">A running record of notable campaign events, oldest first — fed automatically by the scripted DM and bot party as play happens.</p>
    ${events.length ? events.map(e => `
      <div class="card">
        <p class="hint" style="margin:0 0 .2rem">${new Date(e.createdAt).toLocaleString()}</p>
        <p style="margin:0">${escapeHtml(e.text)}</p>
      </div>
    `).join('') : emptyState('🕰', 'No events recorded yet', 'Play a session — narrate scenes, issue party commands, run combat — and they will appear here.')}
  `;
}
