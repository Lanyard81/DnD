<!doctype html>
<html lang="en" data-theme="dark_fantasy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FableTable Solo</title>
<meta name="description" content="A solo, offline, 5E-compatible tabletop RPG companion. Not affiliated with Wizards of the Coast.">
<link rel="manifest" href="manifest.json" onerror="this.remove()">
<meta name="theme-color" content="#1a1420">
<style>
/* =========================================================
   THEME TOKENS
   ========================================================= */
:root, [data-theme="dark_fantasy"] {
  --bg: #17121c;
  --bg-elevated: #201a29;
  --bg-card: #251e30;
  --bg-input: #1c1624;
  --border: #3a3048;
  --text: #ece6f2;
  --text-muted: #a598b3;
  --text-faint: #766c85;
  --accent: #b3893f;
  --accent-strong: #d6a94f;
  --accent-text: #221a10;
  --danger: #c65454;
  --success: #5fae72;
  --info: #6a93c4;
  --shadow: 0 4px 16px rgba(0,0,0,0.45);
  --radius: 10px;
  --font-heading: Georgia, 'Iowan Old Style', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
[data-theme="clean_modern"] {
  --bg: #f4f5f7;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-input: #f0f1f4;
  --border: #dde1e6;
  --text: #1c2129;
  --text-muted: #5a6472;
  --text-faint: #8a93a1;
  --accent: #3661d6;
  --accent-strong: #2649b3;
  --accent-text: #ffffff;
  --danger: #c0392b;
  --success: #2e9e5b;
  --info: #2f7fc1;
  --shadow: 0 2px 10px rgba(20,25,35,0.08);
  --radius: 10px;
  --font-heading: 'Segoe UI', Roboto, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
[data-theme="parchment"] {
  --bg: #ece0c4;
  --bg-elevated: #f5ecd4;
  --bg-card: #f7f0dc;
  --bg-input: #ece1c6;
  --border: #c9b788;
  --text: #3a2b18;
  --text-muted: #6b5636;
  --text-faint: #8f7c58;
  --accent: #8a2f22;
  --accent-strong: #6f2419;
  --accent-text: #f7f0dc;
  --danger: #8a2f22;
  --success: #4c6b35;
  --info: #4a5f7a;
  --shadow: 0 3px 12px rgba(60,40,10,0.25);
  --radius: 4px;
  --font-heading: Georgia, 'Palatino Linotype', serif;
  --font-body: Georgia, 'Palatino Linotype', serif;
}
[data-theme="minimal"] {
  --bg: #ffffff;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-input: #fafafa;
  --border: #e4e4e7;
  --text: #18181b;
  --text-muted: #6b6b70;
  --text-faint: #9a9aa0;
  --accent: #18181b;
  --accent-strong: #000000;
  --accent-text: #ffffff;
  --danger: #b3261e;
  --success: #2d6a3e;
  --info: #33547c;
  --shadow: 0 1px 4px rgba(0,0,0,0.08);
  --radius: 6px;
  --font-heading: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* =========================================================
   RESET & BASE
   ========================================================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior-y: contain;
}
h1,h2,h3,h4 { font-family: var(--font-heading); margin: 0 0 .4em; color: var(--text); }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
p { margin: 0 0 .6em; color: var(--text-muted); }
a { color: var(--accent-strong); }
button { font-family: inherit; }
::selection { background: var(--accent); color: var(--accent-text); }

/* =========================================================
   LAYOUT SHELL
   ========================================================= */
#app { display: flex; flex-direction: column; min-height: 100vh; }
header.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: .5rem;
  padding: .75rem .9rem;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
}
header.topbar h1 { font-size: 1.05rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header.topbar .icon-btn { flex-shrink: 0; }
main.screen {
  flex: 1;
  padding: .9rem .9rem 5.5rem;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}
nav.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
nav.bottomnav button {
  flex: 1;
  background: none; border: none; cursor: pointer;
  padding: .5rem .2rem .4rem;
  display: flex; flex-direction: column; align-items: center; gap: .15rem;
  color: var(--text-faint);
  font-size: .68rem;
  min-height: 52px;
}
nav.bottomnav button .ico { font-size: 1.25rem; line-height: 1; }
nav.bottomnav button.active { color: var(--accent-strong); }

/* =========================================================
   COMPONENTS
   ========================================================= */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .9rem;
  margin-bottom: .75rem;
  box-shadow: var(--shadow);
}
.card.tap { cursor: pointer; }
.card.tap:active { transform: scale(0.99); }
.row { display: flex; align-items: center; gap: .5rem; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: .5rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: .5rem; }
.grid6 { display: grid; grid-template-columns: repeat(3,1fr); gap: .5rem; }
@media (min-width: 480px) { .grid6 { grid-template-columns: repeat(6,1fr); } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text);
  padding: .65rem 1rem;
  font-size: .92rem;
  cursor: pointer;
  min-height: 44px;
  touch-action: manipulation;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.block { width: 100%; }
.btn.sm { padding: .4rem .7rem; min-height: 36px; font-size: .82rem; }
.icon-btn {
  background: none; border: none; color: var(--text);
  font-size: 1.25rem; width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.icon-btn:active { background: var(--bg-input); }

label { display: block; font-size: .78rem; color: var(--text-muted); margin-bottom: .25rem; font-weight: 600; letter-spacing: .01em; }
input[type=text], input[type=number], input[type=search], select, textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: .6rem .7rem;
  font-size: .95rem;
  font-family: inherit;
}
textarea { resize: vertical; min-height: 4.5em; }
.field { margin-bottom: .75rem; }
.hint { font-size: .74rem; color: var(--text-faint); margin-top: .25rem; }

.badge {
  display: inline-block; padding: .15rem .55rem; border-radius: 999px;
  background: var(--bg-input); border: 1px solid var(--border);
  font-size: .7rem; color: var(--text-muted); white-space: nowrap;
}
.badge.accent { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

.statbox {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .5rem .3rem;
  text-align: center;
}
.statbox .label { font-size: .62rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); }
.statbox .value { font-size: 1.3rem; font-weight: 700; font-family: var(--font-heading); }
.statbox .sub { font-size: .68rem; color: var(--text-muted); }

.empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-faint); }
.empty-state .big-ico { font-size: 2.4rem; margin-bottom: .5rem; }

.stepper { display: flex; gap: .35rem; margin-bottom: 1rem; }
.stepper .dot { flex: 1; height: 5px; border-radius: 3px; background: var(--border); }
.stepper .dot.done, .stepper .dot.active { background: var(--accent); }

.list-add-row { display: flex; gap: .4rem; margin-top: .4rem; }
.list-add-row input { flex: 1; }
.chip-list { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .3rem; }
.chip {
  display: inline-flex; align-items: center; gap: .35rem;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 999px; padding: .3rem .6rem; font-size: .8rem;
}
.chip button { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: .85rem; padding: 0; line-height: 1; }

table.data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.data-table th, table.data-table td { text-align: left; padding: .4rem .3rem; border-bottom: 1px solid var(--border); }
table.data-table th { color: var(--text-faint); font-weight: 600; font-size: .72rem; text-transform: uppercase; }

.toast-region { position: fixed; top: .6rem; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: .4rem; width: min(92vw, 420px); }
.toast {
  background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius); padding: .6rem .8rem; box-shadow: var(--shadow); font-size: .85rem;
  animation: toast-in .18s ease-out;
}
.toast.danger { border-color: var(--danger); }
.toast.success { border-color: var(--success); }
@keyframes toast-in { from { opacity:0; transform: translateY(-8px);} to {opacity:1; transform: translateY(0);} }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 620px) { .modal-backdrop { align-items: center; } }
.modal-sheet {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0));
}
@media (min-width: 620px) { .modal-sheet { border-radius: var(--radius); max-height: 82vh; } }

.section-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin: 1.1rem 0 .4rem; font-weight: 700; }
.section-title:first-child { margin-top: 0; }

.disclaimer-footer { text-align: center; font-size: .68rem; color: var(--text-faint); padding: 1rem .5rem 0; }

.theme-swatch-row { display: grid; grid-template-columns: repeat(2,1fr); gap: .6rem; }
.theme-swatch {
  border-radius: var(--radius); border: 2px solid var(--border); padding: .7rem; cursor: pointer; text-align: left;
}
.theme-swatch.selected { border-color: var(--accent); }
.theme-swatch .sw-preview { height: 28px; border-radius: 6px; margin-bottom: .4rem; display: flex; overflow: hidden; }
.theme-swatch .sw-preview span { flex: 1; }

.skill-row { display: flex; align-items: center; gap: .5rem; padding: .3rem 0; border-bottom: 1px solid var(--border); font-size: .85rem; }
.skill-row:last-child { border-bottom: none; }
.skill-row .sk-name { flex: 1; }
.skill-row .sk-mod { width: 2.4em; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.prof-toggle {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
  background: transparent; cursor: pointer; flex-shrink: 0; padding: 0;
}
.prof-toggle.on { background: var(--accent); border-color: var(--accent); }

.tabbar { display: flex; gap: .3rem; overflow-x: auto; margin-bottom: .8rem; padding-bottom: .2rem; }
.tabbar button {
  flex-shrink: 0; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
  padding: .45rem .8rem; border-radius: 999px; font-size: .8rem; cursor: pointer;
}
.tabbar button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }

.landing-hero { text-align: center; padding: 2rem 0 1rem; }
.landing-hero h1 { font-size: 1.8rem; }
.landing-hero p.tag { color: var(--text-muted); font-size: .92rem; }

/* ---- Dice tray ---- */
.dice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
.die-btn {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); cursor: pointer; font-weight: 700; font-size: 1rem; gap: .1rem;
  touch-action: manipulation;
}
.die-btn:active { transform: scale(0.95); background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.die-btn .die-label { font-size: .62rem; font-weight: 400; color: var(--text-faint); }
.die-btn:active .die-label { color: var(--accent-text); opacity: .85; }
.adv-toggle-row { display: flex; gap: .4rem; margin-top: .7rem; }
.adv-toggle-row button {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
  padding: .5rem; border-radius: var(--radius); font-size: .82rem; cursor: pointer;
}
.adv-toggle-row button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.roll-result-banner {
  text-align: center; padding: 1rem; border-radius: var(--radius); background: var(--bg-input);
  border: 1px solid var(--border); margin-top: .8rem;
}
.roll-result-banner .rr-total { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 700; }
.roll-result-banner .rr-total.rolling { animation: rr-pulse .12s infinite alternate; }
@keyframes rr-pulse { from { opacity: .55; } to { opacity: 1; } }
.roll-result-banner .rr-detail { color: var(--text-muted); font-size: .8rem; margin-top: .2rem; }

/* ---- Unified session log ---- */
.log-composer { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
.log-type-row { display: flex; gap: .35rem; }
.log-type-row button {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
  padding: .45rem; border-radius: var(--radius); font-size: .78rem; cursor: pointer;
}
.log-type-row button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.log-feed { display: flex; flex-direction: column-reverse; gap: .5rem; }
.log-entry { padding: .55rem .7rem; border-radius: var(--radius); border-left: 3px solid var(--border); background: var(--bg-card); font-size: .88rem; }
.log-entry .le-meta { font-size: .68rem; color: var(--text-faint); margin-bottom: .15rem; text-transform: uppercase; letter-spacing: .03em; }
.log-entry.type-narration { border-left-color: var(--accent); }
.log-entry.type-ooc { border-left-color: var(--info); font-style: normal; opacity: .85; }
.log-entry.type-ooc .le-text::before { content: "(OOC) "; color: var(--text-faint); }
.log-entry.type-emote { border-left-color: var(--success); font-style: italic; }
.log-entry.type-system { border-left-color: var(--text-faint); background: var(--bg-input); }
.log-entry.type-dialogue { border-left-color: var(--accent-strong); }
.log-entry.type-override { border-left-color: var(--danger); }

/* ---- Combat / initiative tracker ---- */
.combatant-card { border-left: 4px solid var(--border); position: relative; }
.combatant-card.side-party { border-left-color: var(--info); }
.combatant-card.side-enemy { border-left-color: var(--danger); }
.combatant-card.is-active { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.combatant-card.is-down { opacity: .55; }
.combatant-card .cc-hpbar { height: 6px; border-radius: 3px; background: var(--bg-input); overflow: hidden; margin: .4rem 0 .3rem; }
.combatant-card .cc-hpbar-fill { height: 100%; background: var(--success); transition: width .2s; }
.combatant-card .cc-hpbar-fill.low { background: var(--danger); }
.combatant-card .cc-inline-inputs input { width: 3.4em; text-align: center; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: .2rem; font-weight: 700; }
.turn-order-strip { display: flex; gap: .35rem; overflow-x: auto; padding: .3rem 0 .7rem; }
.turn-order-strip .tos-chip {
  flex-shrink: 0; padding: .35rem .6rem; border-radius: 999px; font-size: .74rem;
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap;
}
.turn-order-strip .tos-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
.turn-order-strip .tos-chip.down { text-decoration: line-through; opacity: .5; }
.round-banner { text-align: center; padding: .6rem; border-radius: var(--radius); background: var(--bg-input); border: 1px solid var(--border); margin-bottom: .8rem; font-family: var(--font-heading); font-size: 1.1rem; }
.combat-over-banner { text-align: center; padding: 1.2rem; border-radius: var(--radius); background: var(--bg-card); border: 2px solid var(--accent); margin-bottom: 1rem; }

/* ---- Map / board view ---- */
.map-toolbar { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .6rem; }
.map-toolbar button {
  flex-shrink: 0; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
  padding: .45rem .7rem; border-radius: 999px; font-size: .78rem; cursor: pointer; white-space: nowrap;
}
.map-toolbar button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.map-viewport {
  width: 100%; height: 60vh; overflow: hidden; touch-action: none; position: relative;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
}
.map-viewport svg { display: block; }
.map-cell { fill: var(--bg-card); stroke: var(--border); stroke-width: 1; }
.map-cell.blocked { fill: var(--text-faint); opacity: .35; }
.map-cell.highlight-range { fill: var(--info); opacity: .28; }
.map-cell.highlight-aoe { fill: var(--danger); opacity: .35; }
.map-cell.fog { fill: #000; opacity: .82; }
.map-token circle { stroke: var(--bg); stroke-width: 2; }
.map-token text { font-size: 10px; fill: var(--accent-text); text-anchor: middle; dominant-baseline: central; font-weight: 700; pointer-events: none; }
.map-token.active-turn circle { stroke: var(--accent-strong); stroke-width: 3; }
.map-los-line { stroke-width: 2; }

/* ---- DM panel ---- */
.dm-panel { border: 2px solid var(--accent); }
.dm-panel .section-title:first-child { margin-top: 0; }
.dm-verb-row { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
.dm-verb-row button { flex: 1 1 30%; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-region" id="toastRegion"></div>

<script>

'use strict';
/* =========================================================
   FableTable Solo
   A single-file, offline, deterministic solo tabletop RPG companion.
   Not affiliated with, endorsed by, or sponsored by Wizards of the Coast.

   Section index:
     1. Utilities (uid, RNG, formatters, dice/rules-core)
     2. DB layer (IndexedDB wrapper + schema)
     3. Data model constructors/validators (+ pregenerated sample characters)
     4. Toast / small UI helpers
     5. Router / app shell
     6. Screens: Landing, Campaign List, Campaign Wizard, Campaign Detail,
                 Character Wizard, Character Sheet, Table/Session, Settings
     7. Dice tray + unified log helpers
     8. Bootstrap
   ========================================================= */

/* ---------- 1. UTILITIES ---------- */
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function nowIso() { return new Date().toISOString(); }

// Mulberry32 seeded PRNG (public domain) — used by content generation in later phases.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeSeed() { return Math.floor(Math.random() * 0xFFFFFFFF); }

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function abilityMod(score) { return Math.floor((Number(score || 10) - 10) / 2); }
function fmtMod(n) { return n >= 0 ? '+' + n : String(n); }
function profBonusForLevel(level) { return 2 + Math.floor((Math.max(1, Number(level || 1)) - 1) / 4); }

const DB_NAME = 'fabletable_db';
const DB_VERSION = 1;

// Store definitions across the whole app lifetime (DATA_MODEL.md). Created now
// so later phases never need a version-bump migration for stores already planned.
const STORE_DEFS = [
  { name: 'campaigns', indexes: [] },
  { name: 'characters', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'bots', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'npcs', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'monsters', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'items', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },

  { name: 'features', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'effects', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'conditions', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'quests', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'quest_objectives', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }, { name: 'questId', keyPath: 'questId' }] },

  { name: 'campaign_memory', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'ai_settings', indexes: [{ name: 'campaignId', keyPath: 'campaignId' }] },
  { name: 'app_settings', indexes: [] },
  { name: 'content_packs', indexes: [] }
];

const DB = (() => {
  let dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (ev) => {
        const db = req.result;
        for (const def of STORE_DEFS) {
          if (!db.objectStoreNames.contains(def.name)) {
            const store = db.createObjectStore(def.name, { keyPath: 'id' });
            for (const idx of def.indexes) store.createIndex(idx.name, idx.keyPath, { unique: false });
          }
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function tx(storeName, mode) {
    const db = await open();
    return db.transaction(storeName, mode).objectStore(storeName);
  }

  return {
    async put(storeName, obj) {
      const store = await tx(storeName, 'readwrite');
      return new Promise((resolve, reject) => {
        const r = store.put(obj);
        r.onsuccess = () => resolve(obj);
        r.onerror = () => reject(r.error);
      });
    },
    async get(storeName, id) {
      const store = await tx(storeName, 'readonly');
      return new Promise((resolve, reject) => {
        const r = store.get(id);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => reject(r.error);
      });
    },
    async delete(storeName, id) {
      const store = await tx(storeName, 'readwrite');
      return new Promise((resolve, reject) => {
        const r = store.delete(id);
        r.onsuccess = () => resolve();
        r.onerror = () => reject(r.error);
      });
    },
    async getAll(storeName) {
      const store = await tx(storeName, 'readonly');
      return new Promise((resolve, reject) => {
        const r = store.getAll();
        r.onsuccess = () => resolve(r.result || []);
        r.onerror = () => reject(r.error);
      });
    },
    async getAllByIndex(storeName, indexName, value) {
      const store = await tx(storeName, 'readonly');
      return new Promise((resolve, reject) => {
        const idx = store.index(indexName);
        const r = idx.getAll(value);
        r.onsuccess = () => resolve(r.result || []);
        r.onerror = () => reject(r.error);
      });
    },
    async clearStore(storeName) {
      const store = await tx(storeName, 'readwrite');
      return new Promise((resolve, reject) => {
        const r = store.clear();
        r.onsuccess = () => resolve();
        r.onerror = () => reject(r.error);
      });
    }
  };
})();

function makeCampaign({ name, description, rulesProfile, automationLevel, aiDmEnabled, theme, playMode }) {
  const id = uid();
  const ts = nowIso();
  return {
    id,
    name: (name || 'Untitled Campaign').trim(),
    description: description || '',
    rulesProfile: RULES_PROFILES.includes(rulesProfile) ? rulesProfile : 'legacy',
    automationLevel: AUTOMATION_LEVELS.includes(automationLevel) ? automationLevel : 'medium',
    aiDmEnabled: !!aiDmEnabled,
    theme: THEMES.some(t => t.id === theme) ? theme : 'dark_fantasy',
    playMode: PLAY_MODES.some(p => p.id === playMode) ? playMode : 'solo_party',
    createdAt: ts,
    updatedAt: ts,
    lastPlayedAt: ts,
    activeSceneId: null,
    currentEncounterId: null,
    seed: makeSeed()
  };
}

function validateCampaign(c) {
  const errs = [];
  if (!c || typeof c !== 'object') return ['Campaign is not an object'];
  if (!c.name || !String(c.name).trim()) errs.push('Name is required');
  if (!RULES_PROFILES.includes(c.rulesProfile)) errs.push('Invalid rules profile');
  if (!AUTOMATION_LEVELS.includes(c.automationLevel)) errs.push('Invalid automation level');
  return errs;
}

// Creates one bot: a `characters` row (controlledBy:'bot') + linked `bots` row.
// Random but reasonable stats (standard-array-ish spread) so a fresh bot is
// immediately playable without manual tuning.
async function createBot(campaignId, nameOverride) {
  const usedNames = (await DB.getAllByIndex('characters', 'campaignId', campaignId)).map(c => c.name);
  const availableNames = BOT_NAME_POOL.filter(n => !usedNames.includes(n));
  const name = nameOverride || pick(availableNames.length ? availableNames : BOT_NAME_POOL);
  const species = pick(SUGGESTED_SPECIES);
  const klass = pick(SUGGESTED_CLASSES);
  const array = [15, 14, 13, 12, 10, 8].sort(() => Math.random() - 0.5);

  const char = makeCharacter({ campaignId, controlledBy: 'bot' });
  char.name = name;
  char.species = species;
  char.class = klass;
  char.abilities = { str: array[0], dex: array[1], con: array[2], int: array[3], wis: array[4], cha: array[5] };
  char.proficiencyBonus = profBonusForLevel(1);
  char.initiativeBonus = abilityMod(char.abilities.dex);
  char.ac = 10 + abilityMod(char.abilities.dex) + (roleForClass(klass) === 'tank' ? 4 : 1);
  const hp = 8 + abilityMod(char.abilities.con) + (roleForClass(klass) === 'tank' ? 3 : 0);
  char.hp = { current: Math.max(4, hp), max: Math.max(4, hp), temp: 0 };
  char.background = pick(SUGGESTED_BACKGROUNDS);
  await DB.put('characters', char);

  const personality = generateBotPersonality();
  const bot = makeBotProfile({ campaignId, characterId: char.id, personality });
  await DB.put('bots', bot);
  return { character: char, bot };
}

// NOTE on schema: DATA_MODEL.md's `encounters.combatants` was specified as
// lightweight refs ({tokenId|characterId|monsterId, side}). Phase 4 has no
// map/token layer yet (that's Phase 5) and needs independent HP/conditions
// per combatant instance (two goblins from the same template need separate
// HP tracks), so combatants here are snapshot objects carrying their own
// hp/ac/conditions/attacks alongside refType/refId for traceability. This is
// an intentional, documented extension of the schema, not a drift — see
// DECISIONS.md D13.
function makeMonster({ campaignId, name, ac, hpMax, attackName, attackBonus, damageDice, damageType, attackCount, resistances, immunities, vulnerabilities, savingThrows }) {
  return {
    id: uid(), campaignId: campaignId || null, name, size: 'medium', type: 'monstrosity',
    ac: ac || 10, hp: { formula: '', max: hpMax || 10 }, speed: 30,
    abilities: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
    savingThrows: savingThrows || {}, skills: {},
    resistances: resistances || [], immunities: immunities || [], vulnerabilities: vulnerabilities || [],
    senses: '', languages: '', challengeRating: 0,
    traits: [],
    actions: [{ name: attackName || 'Strike', attackBonus: attackBonus || '+3', damageDice: damageDice || '1d6+1', damageType: damageType || 'bludgeoning', attackCount: Math.max(1, attackCount || 1) }],
    legendaryActions: null, tokenImage: null
  };
}

function getPrimaryAttack(combatant) {
  if (combatant.attacks && combatant.attacks.length) return combatant.attacks[0];
  const mod = combatant.primaryAbilityMod ?? 2;
  return { name: 'Improvised Attack', attackBonus: fmtMod(2 + mod), damageDice: '1d6' + (mod ? fmtMod(mod) : ''), damageType: 'bludgeoning' };
}

// Async because it looks up the character's first combat-usable known spell
// (one with a damageDice or healFormula set in the homebrew Spells library)
// to give bots something to `cast` in resolveBotTurn/chooseBotAction.
async function combatantFromCharacter(char, bot) {
  let spell = null;
  for (const spellId of (char.spellsKnown || [])) {
    const s = await DB.get('spells', spellId);
    if (s && s.damageDice) { spell = { type: 'damage', formula: s.damageDice, name: s.name, level: s.level || 1 }; break; }
    if (s && s.healFormula) { spell = { type: 'heal', formula: s.healFormula, name: s.name, level: s.level || 1 }; break; }
  }
  return {
    id: uid(), refType: 'character', refId: char.id,
    name: char.name, side: 'party',
    hp: { current: char.hp.current, max: char.hp.max, temp: char.hp.temp || 0 },
    ac: char.ac, initiativeBonus: char.initiativeBonus || 0,
    primaryAbilityMod: Math.max(abilityMod(char.abilities.str), abilityMod(char.abilities.dex)),
    abilities: char.abilities, savingThrows: char.savingThrows || {}, level: char.level || 1,
    resistances: char.resistances || [], immunities: char.immunities || [], vulnerabilities: char.vulnerabilities || [],
    conditions: [], attacks: char.attacks || [], spell,
    isBot: char.controlledBy === 'bot',
    combatStyle: bot ? bot.combatStyle : 'moderate',
    isHealer: isHealerClass(char.class),
    role: roleForClass(char.class),
    botId: bot ? bot.id : null,
    initiativeRoll: 0, hasActed: false
  };
}
function combatantFromMonster(monster, index, total) {
  const action = monster.actions[0] || {};
  return {
    id: uid(), refType: 'monster', refId: monster.id,
    name: total > 1 ? `${monster.name} ${index + 1}` : monster.name, side: 'enemy',
    hp: { current: monster.hp.max, max: monster.hp.max, temp: 0 },
    ac: monster.ac, initiativeBonus: 0,
    abilities: monster.abilities || {}, savingThrows: monster.savingThrows || {},
    resistances: monster.resistances || [], immunities: monster.immunities || [], vulnerabilities: monster.vulnerabilities || [],
    conditions: [], attacks: [{ id: uid(), name: action.name, attackBonus: action.attackBonus, damageDice: action.damageDice, damageType: action.damageType, attackCount: Math.max(1, action.attackCount || 1), notes: '' }],
    isBot: true, combatStyle: 'simple', isHealer: false, role: 'minion', botId: null,
    initiativeRoll: 0, hasActed: false
  };
}

function makeEncounter({ campaignId, name, combatants, initiativeOrder }) {
  return {
    id: uid(), campaignId, name: name || 'Encounter', mapId: null, status: 'active',
    combatants, initiativeOrder, roundNumber: 1, activeIndex: 0,
    createdAt: nowIso()
  };
}

function findCombatant(encounter, id) { return encounter.combatants.find(c => c.id === id); }
function encounterHpLookup(encounter) {
  const map = {};
  encounter.combatants.forEach(c => { map[c.id] = c.hp.current; });
  return map;
}
function encounterSideLookup(encounter) {
  const map = {};
  encounter.combatants.forEach(c => { map[c.id] = c.side; });
  return map;
}

async function startEncounter(campaignId, name, partyCombatants, monsterDrafts) {
  const combatants = [...partyCombatants];
  for (const draft of monsterDrafts) {
    // A draft picked from the homebrew Monster Library carries its source
    // row's id — reuse that row instead of minting a new `monsters` entry,
    // so repeated encounters with the same library monster don't pile up
    // duplicate rows (see DECISIONS.md D20).
    let monster = draft.libraryMonsterId ? await DB.get('monsters', draft.libraryMonsterId) : null;
    if (!monster) monster = makeMonster({ campaignId, name: draft.name, ac: draft.ac, hpMax: draft.hp, attackBonus: draft.attackBonus, damageDice: draft.damageDice, damageType: draft.damageType });
    if (!draft.libraryMonsterId) await DB.put('monsters', monster);
    for (let i = 0; i < draft.qty; i++) combatants.push(combatantFromMonster(monster, i, draft.qty));
  }
  combatants.forEach(c => { c.initiativeRoll = rollD20(c.initiativeBonus, 'none').total; });
  const sorted = sortInitiative(combatants.map(c => ({ id: c.id, roll: c.initiativeRoll, dexMod: c.initiativeBonus })));
  const initiativeOrder = sorted.map(s => s.id);

  const encounter = makeEncounter({ campaignId, name, combatants, initiativeOrder });
  await DB.put('encounters', encounter);

  const campaign = await DB.get('campaigns', campaignId);
  campaign.currentEncounterId = encounter.id;
  await DB.put('campaigns', campaign);

  const orderText = initiativeOrder.map(id => { const c = findCombatant(encounter, id); return `${c.name} (${c.initiativeRoll})`; }).join(', ');
  await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'system', text: `⚔ Combat begins! Initiative order: ${orderText}` }));
  return encounter;
}

async function combatAttack(encounter, attacker, target) {
  const atk = getPrimaryAttack(attacker);
  const bonus = parseInt(String(atk.attackBonus).replace(/[^\d-]/g, '')) || 0;
  const roll = rollD20(bonus, 'none');
  const hit = roll.total >= target.ac;
  const diceRoll = makeDiceRoll({ campaignId: encounter.campaignId, actorType: attacker.isBot ? 'bot' : 'player', actorId: attacker.refId, formula: `1d20${bonus >= 0 ? '+' : ''}${bonus}`, dice: roll.rolls, modifier: bonus, total: roll.total, purpose: `${atk.name} attack vs ${target.name}` });
  await DB.put('dice_rolls', diceRoll);
  let resultSummary;
  if (hit) {
    const dmgParsed = parseDiceFormula(atk.damageDice) || { count: 1, sides: 6, modifier: 0 };
    const dmgResult = rollFormula(dmgParsed);
    const dmgRoll = makeDiceRoll({ campaignId: encounter.campaignId, actorType: attacker.isBot ? 'bot' : 'player', actorId: attacker.refId, formula: atk.damageDice, dice: dmgResult.dice, modifier: dmgResult.modifier, total: dmgResult.total, purpose: `${atk.name} damage` });
    await DB.put('dice_rolls', dmgRoll);
    const applied = applyDamageWithResistance(dmgResult.total, atk.damageType, target);
    let remaining = applied;
    if (target.hp.temp > 0) { const absorbed = Math.min(target.hp.temp, remaining); target.hp.temp -= absorbed; remaining -= absorbed; }
    target.hp.current = clamp(target.hp.current - remaining, 0, target.hp.max);
    const resistNote = applied !== dmgResult.total ? ` (${applied === 0 ? 'immune' : applied < dmgResult.total ? 'resisted' : 'vulnerable'}, ${applied} taken)` : '';
    resultSummary = `${attacker.name} hits ${target.name} with ${atk.name} for ${dmgResult.total} (${atk.damageType || 'damage'})${resistNote}. ${target.name} at ${target.hp.current}/${target.hp.max} HP.`;
  } else {
    resultSummary = `${attacker.name} attacks ${target.name} with ${atk.name} and misses (rolled ${roll.total} vs AC ${target.ac}).`;
  }
  await DB.put('log_entries', makeLogEntry({ campaignId: encounter.campaignId, type: 'system', speakerType: attacker.isBot ? 'bot' : 'player', speakerId: attacker.refId, text: resultSummary }));
  await DB.put('combat_logs', { id: uid(), campaignId: encounter.campaignId, encounterId: encounter.id, roundNumber: encounter.roundNumber, actorId: attacker.id, actionType: 'attack', targetId: target.id, resultSummary, createdAt: nowIso() });
  return { hit, resultSummary };
}

async function combatHeal(encounter, healer, target) {
  const dmgResult = rollFormula('1d8+2');
  const roll = makeDiceRoll({ campaignId: encounter.campaignId, actorType: 'bot', actorId: healer.refId, formula: '1d8+2', dice: dmgResult.dice, modifier: dmgResult.modifier, total: dmgResult.total, purpose: 'healing' });
  await DB.put('dice_rolls', roll);
  target.hp.current = clamp(target.hp.current + dmgResult.total, 0, target.hp.max);
  const resultSummary = `${healer.name} channels healing into ${target.name} for ${dmgResult.total}. ${target.name} at ${target.hp.current}/${target.hp.max} HP.`;
  await DB.put('log_entries', makeLogEntry({ campaignId: encounter.campaignId, type: 'system', speakerType: 'bot', speakerId: healer.refId, text: resultSummary }));
  await DB.put('combat_logs', { id: uid(), campaignId: encounter.campaignId, encounterId: encounter.id, roundNumber: encounter.roundNumber, actorId: healer.id, actionType: 'heal', targetId: target.id, resultSummary, createdAt: nowIso() });
  return { resultSummary };
}

// A spellcast auto-hits (no AC roll) — unlike combatAttack — since we don't
// model spell save DCs; it's the same simplification combatHeal already makes.
async function combatCast(encounter, caster, target, spell) {
  const dmgResult = rollFormula(spell.formula);
  const roll = makeDiceRoll({ campaignId: encounter.campaignId, actorType: 'bot', actorId: caster.refId, formula: spell.formula, dice: dmgResult.dice, modifier: dmgResult.modifier, total: dmgResult.total, purpose: `${spell.name || 'spell'} damage` });
  await DB.put('dice_rolls', roll);
  let remaining = dmgResult.total;
  if (target.hp.temp > 0) { const absorbed = Math.min(target.hp.temp, remaining); target.hp.temp -= absorbed; remaining -= absorbed; }
  target.hp.current = clamp(target.hp.current - remaining, 0, target.hp.max);
  const resultSummary = `${caster.name} casts ${spell.name || 'a spell'} at ${target.name} for ${dmgResult.total}. ${target.name} at ${target.hp.current}/${target.hp.max} HP.`;
  await DB.put('log_entries', makeLogEntry({ campaignId: encounter.campaignId, type: 'system', speakerType: 'bot', speakerId: caster.refId, text: resultSummary }));
  await DB.put('combat_logs', { id: uid(), campaignId: encounter.campaignId, encounterId: encounter.id, roundNumber: encounter.roundNumber, actorId: caster.id, actionType: 'cast', targetId: target.id, resultSummary, createdAt: nowIso() });
  return { resultSummary };
}

async function resolveBotTurn(encounter, combatant) {
  const allies = encounter.combatants.filter(c => c.side === combatant.side && c.id !== combatant.id).map(c => ({ id: c.id, name: c.name, hp: c.hp.current, hpMax: c.hp.max }));
  const enemies = encounter.combatants.filter(c => c.side !== combatant.side).map(c => ({ id: c.id, name: c.name, hp: c.hp.current, hpMax: c.hp.max, role: c.role || 'minion' }));
  const situation = { self: { hp: combatant.hp.current, hpMax: combatant.hp.max, isHealer: combatant.isHealer, spell: combatant.spell }, allies, enemies };
  const action = chooseBotAction(combatant.combatStyle, situation);
  if (action.type === 'attack') {
    const target = findCombatant(encounter, action.targetId);
    if (target) {
      const atk = getPrimaryAttack(combatant);
      const swings = Math.max(1, atk.attackCount || 1);
      let last = null;
      for (let i = 0; i < swings; i++) {
        const liveTarget = findCombatant(encounter, target.id);
        if (!liveTarget || isCombatantDown(liveTarget.hp.current)) break;
        last = await combatAttack(encounter, combatant, liveTarget);
      }
      return last;
    }
  } else if (action.type === 'cast') {
    const target = findCombatant(encounter, action.targetId);
    if (target) {
      // Spell casting draws down a real spell slot on the underlying
      // character (combatants are per-encounter snapshots — see D13 — so the
      // slot lives on the DB row, not this object). No slot left, or this
      // isn't a slot-tracked caster: fall back to a mundane attack instead
      // of casting for free (closes D19's original "no slot consumption" gap).
      const level = (combatant.spell && combatant.spell.level) || 1;
      const char = combatant.refType === 'character' ? await DB.get('characters', combatant.refId) : null;
      if (char && consumeSpellSlot(char, level)) {
        await DB.put('characters', char);
        return await combatCast(encounter, combatant, target, combatant.spell);
      }
      return await combatAttack(encounter, combatant, target);
    }
  } else if (action.type === 'heal') {
    const target = findCombatant(encounter, action.targetId);
    if (target) return await combatHeal(encounter, combatant, target);
  }
  await DB.put('log_entries', makeLogEntry({ campaignId: encounter.campaignId, type: 'system', speakerType: 'bot', speakerId: combatant.refId, text: `${combatant.name} holds position.` }));
  return { resultSummary: `${combatant.name} holds.` };
}

/* ---- Campaign memory (plain structured facts/events — no embeddings) ---- */
async function getOrCreateCampaignMemory(campaignId) {
  const rows = await DB.getAllByIndex('campaign_memory', 'campaignId', campaignId);
  if (rows.length) return rows[0];
  const fresh = { id: uid(), campaignId, npcStanding: {}, partyBonds: [], taggedFacts: [], recentEventsRingBuffer: [] };
  await DB.put('campaign_memory', fresh);
  return fresh;
}
async function addCampaignFact(campaignId, key, value, tags) {
  const mem = await getOrCreateCampaignMemory(campaignId);
  const idx = mem.taggedFacts.findIndex(f => f.key === key);
  const fact = { key, value, tags: tags || [], createdAt: nowIso() };
  if (idx >= 0) mem.taggedFacts[idx] = fact; else mem.taggedFacts.push(fact);
  await DB.put('campaign_memory', mem);
  return mem;
}
async function addCampaignRecentEvent(campaignId, text) {
  const mem = await getOrCreateCampaignMemory(campaignId);
  mem.recentEventsRingBuffer.push({ text, createdAt: nowIso() });
  if (mem.recentEventsRingBuffer.length > BOT_MEMORY_RING_LIMIT) mem.recentEventsRingBuffer = mem.recentEventsRingBuffer.slice(-BOT_MEMORY_RING_LIMIT);
  await DB.put('campaign_memory', mem);
  return mem;
}
async function setNpcStanding(campaignId, npcId, delta) {
  const mem = await getOrCreateCampaignMemory(campaignId);
  mem.npcStanding[npcId] = clamp((mem.npcStanding[npcId] || 0) + delta, -100, 100);
  await DB.put('campaign_memory', mem);
  return mem.npcStanding[npcId];
}

/* ---- Scripted DM: content-generation tables (weighted, original, no LLM) ---- */
const NPC_NAME_POOL = ['Old Marrick', 'Sister Yew', 'Captain Bellrose', 'Tobin Ashgate', 'Widow Corvane', 'Fenn the Ledger', 'Auntie Rooke', 'Garrow Thistlewick', 'Ysolde Farrow', 'Brindle the Carter'];
const NPC_ROLES = ['tavern keeper', 'town guard', 'traveling merchant', 'reclusive scholar', 'guild fixer', 'temple acolyte', 'retired adventurer', 'suspicious peddler', 'local healer', 'gate warden'];
const NPC_QUIRKS = ['speaks only in half-finished sentences', 'never makes eye contact', 'keeps a ledger of every favor owed', 'hums constantly, off-key', 'refuses to say a stranger\'s name aloud', 'collects buttons from travelers'];
const SCENE_TEMPLATES = [
  { text: 'You arrive at {location}. The air smells of {sensory}, and {detail}.' },
  { text: '{location} stretches before you — {detail}. Somewhere nearby, {sensory} lingers.' },
  { text: 'The path opens onto {location}. {detail} A faint hint of {sensory} drifts past.' }
];
const SCENE_SENSORY = ['woodsmoke', 'wet stone', 'old parchment', 'salt and tar', 'crushed herbs', 'rain on dust'];
const SCENE_DETAILS = ['a few locals watch you with open curiosity', 'the quiet feels deliberate, like something is listening', 'signs of recent disrepair are everywhere', 'a distant bell marks the hour', 'someone has clearly left in a hurry'];
const LOOT_TABLE = [
  { weight: 3, name: 'a handful of tarnished coins', gold: 8 },
  { weight: 3, name: 'a small pouch of mixed coin', gold: 15 },
  { weight: 2, name: 'a finely made dagger', gold: 0, item: true },
  { weight: 2, name: 'a vial of unlabeled tincture', gold: 0, item: true },
  { weight: 1, name: 'a signet ring of unclear origin', gold: 0, item: true },
  { weight: 1, name: 'a folded letter sealed in wax', gold: 0, item: true }
];
const QUEST_TEMPLATES = [
  { title: 'The {adj} Debt', summary: '{npc} needs something recovered before a deadline no one will explain.', objective: 'Recover the item and return it to {npc}.' },
  { title: 'Word from {location}', summary: 'Travelers report trouble near {location}, and no word has come back since.', objective: 'Investigate {location} and report what you find.' },
  { title: 'The {adj} Favor', summary: '{npc} asks for a favor that sounds simpler than it probably is.', objective: 'Complete the favor for {npc}.' }
];
const QUEST_ADJECTIVES = ['Quiet', 'Unpaid', 'Forgotten', 'Sudden', 'Small'];
const OUTCOME_SUCCESS_BANK = [
  { text: 'It works. {detail}' },
  { text: 'Cleanly done — {detail}' },
  { text: 'Better than expected: {detail}' }
];
const OUTCOME_FAILURE_BANK = [
  { text: 'It doesn\'t go as planned. {detail}' },
  { text: 'Close, but no — {detail}' },
  { text: 'It falls apart at the worst moment. {detail}' }
];
const OUTCOME_DETAILS_SUCCESS = ['no one seems to have noticed', 'exactly as intended', 'with room to spare', 'and it might even help later'];
const OUTCOME_DETAILS_FAILURE = ['and now there\'s a new problem', 'drawing exactly the attention you didn\'t want', 'costing more than expected', 'and the moment is gone'];
const DM_VERBS = ['move', 'attack', 'talk', 'use item', 'cast', 'rest', 'investigate'];

function generateNpc() {
  return { name: pick(NPC_NAME_POOL), role: pick(NPC_ROLES), quirk: pick(NPC_QUIRKS) };
}
function weightedPick(entries) {
  const total = entries.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of entries) { if (r < e.weight) return e; r -= e.weight; }
  return entries[entries.length - 1];
}
function generateLoot() { return weightedPick(LOOT_TABLE); }
function generateQuest(npcName, locationName) {
  const t = pick(QUEST_TEMPLATES);
  const slots = { npc: npcName || 'a local contact', location: locationName || 'the area', adj: pick(QUEST_ADJECTIVES) };
  return { title: fillTemplate(t.title, slots), summary: fillTemplate(t.summary, slots), objective: fillTemplate(t.objective, slots) };
}
function generateSceneNarration(locationName) {
  const bank = SCENE_TEMPLATES;
  const t = pick(bank);
  return fillTemplate(t.text, { location: locationName || 'the scene', sensory: pick(SCENE_SENSORY), detail: pick(SCENE_DETAILS) });
}
function generateOutcome(success) {
  const bank = success ? OUTCOME_SUCCESS_BANK : OUTCOME_FAILURE_BANK;
  const detail = success ? pick(OUTCOME_DETAILS_SUCCESS) : pick(OUTCOME_DETAILS_FAILURE);
  return fillTemplate(pick(bank).text, { detail });
}
function matchDmVerb(text) {
  const t = (text || '').toLowerCase();
  return DM_VERBS.find(v => t.includes(v)) || null;
}

// Structured DM action dispatcher — every scripted-DM button funnels through
// here (narration/add_npc/give_loot/update_quest/request_roll are all Action
// types from ARCHITECTURE.md) rather than writing to stores directly, so DM
// output stays consistent with how manual play already logs itself.
async function applyDmAction(campaignId, action) {
  switch (action.type) {
    case 'narration':
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'narration', speakerType: 'dm_scripted', text: action.text }));
      break;
    case 'add_npc': {
      const npc = { id: uid(), campaignId, name: action.npc.name, role: action.npc.role, disposition: 0, locationId: null, traits: action.npc.quirk, speakingStyle: '', statBlockId: null, dialogueBankId: null, isHidden: false, notes: '' };
      await DB.put('npcs', npc);
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'narration', speakerType: 'dm_scripted', text: `${npc.name}, ${npc.role}, steps into the scene — ${npc.traits}.` }));
      await addCampaignRecentEvent(campaignId, `Met ${npc.name} (${npc.role}).`);
      return npc;
    }
    case 'give_loot':
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'dm_scripted', text: `The party finds ${action.loot.name}${action.loot.gold ? ` (${action.loot.gold} gp)` : ''}.` }));
      await addCampaignRecentEvent(campaignId, `Found ${action.loot.name}.`);
      break;
    case 'update_quest': {
      const ts = nowIso();
      const quest = { id: uid(), campaignId, title: action.quest.title, summary: action.quest.summary, status: 'active', giverNpcId: null, rewardLootTableId: null, createdAt: ts, updatedAt: ts };
      await DB.put('quests', quest);
      await DB.put('quest_objectives', { id: uid(), questId: quest.id, campaignId, text: action.quest.objective, status: 'pending', order: 0 });
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'narration', speakerType: 'dm_scripted', text: `New quest: "${quest.title}" — ${quest.summary}` }));
      await addCampaignRecentEvent(campaignId, `Started quest: ${quest.title}.`);
      return quest;
    }
    case 'ask_player_choice':
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'narration', speakerType: 'dm_scripted', text: action.text || 'What do you do?' }));
      break;
    case 'request_roll':
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'dm_scripted', text: `The DM calls for a roll: ${action.purpose} (DC ${action.dc}).` }));
      break;
    default:
      break;
  }
}

function parseTagList(text) { return (text || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean); }
function parseSaveBonusText(text) {
  const out = {};
  (text || '').split(',').forEach(part => {
    const [k, v] = part.split(':').map(s => (s || '').trim().toLowerCase());
    if (k && ABILITIES.includes(k) && v !== undefined && v !== '') out[k] = parseInt(v) || 0;
  });
  return out;
}
function fmtSaveBonusText(obj) {
  return Object.entries(obj || {}).map(([k, v]) => `${k}:${v}`).join(', ');
}

function parseWeightedLines(text) {
  return (text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const [w, ...rest] = line.split('|');
    return { weight: parseInt(w) || 1, text: rest.join('|').trim() };
  });
}

function validateSchemaEntity(schema, data) {
  const errs = [];
  for (const f of schema.fields) {
    if (f.required && (!data[f.key] || !String(data[f.key]).trim())) errs.push(`${f.label} is required.`);
  }
  return errs;
}

function validateExportPayload(payload) {
  const errors = [];
  if (!payload || typeof payload !== 'object') return ['File is not a valid JSON object.'];
  if (!payload.campaign || typeof payload.campaign !== 'object') { errors.push('Missing campaign data.'); return errors; }
  if (!payload.campaign.name || !String(payload.campaign.name).trim()) errors.push('Campaign is missing a name.');
  if (!payload.campaign.id) errors.push('Campaign is missing an id.');
  for (const key of Object.keys(COLLECTION_FK_MAP)) {
    if (payload[key] !== undefined && !Array.isArray(payload[key])) errors.push(`"${key}" should be a list.`);
  }
  return errors;
}

function remapCampaignExportIds(payload, generateId) {
  const campaignIdMap = new Map();
  const collectionIdMaps = {};
  for (const key of Object.keys(COLLECTION_FK_MAP)) collectionIdMaps[key] = new Map();

  function mapped(map, oldId) {
    if (oldId === null || oldId === undefined) return oldId;
    if (!map.has(oldId)) map.set(oldId, generateId());
    return map.get(oldId);
  }

  const out = {};
  out.formatVersion = payload.formatVersion;
  out.exportedAt = payload.exportedAt;

  const oldCampaignId = payload.campaign.id;
  const newCampaignId = mapped(campaignIdMap, oldCampaignId);
  out.campaign = { ...payload.campaign, id: newCampaignId };

  for (const [key, fkSpec] of Object.entries(COLLECTION_FK_MAP)) {
    const rows = Array.isArray(payload[key]) ? payload[key] : [];
    out[key] = rows.map(row => {
      const newRow = { ...row };
      for (const [field, target] of Object.entries(fkSpec)) {
        if (target === true) {
          newRow[field] = mapped(collectionIdMaps[key], row[field]);
        } else if (target === 'campaign') {
          newRow[field] = row[field] === oldCampaignId ? newCampaignId : mapped(campaignIdMap, row[field]);
        } else if (collectionIdMaps[target]) {
          newRow[field] = mapped(collectionIdMaps[target], row[field]);
        }
      }
      return newRow;
    });
  }

  // campaignMemory.npcStanding is a free-form { npcId: value } map, not a flat
  // FK field, so it needs its own rekeying pass through the npcs id map.
  if (Array.isArray(out.campaignMemory)) {
    out.campaignMemory = out.campaignMemory.map(mem => {
      if (!mem.npcStanding) return mem;
      const rekeyed = {};
      for (const [oldNpcId, value] of Object.entries(mem.npcStanding)) {
        rekeyed[mapped(collectionIdMaps.npcs, oldNpcId)] = value;
      }
      return { ...mem, npcStanding: rekeyed };
    });
  }

  return out;
}

// Writes one adventure's NPCs/locations/quest/monsters into a campaign.
// Returns a summary object for a toast message. Idempotent-ish: calling it
// twice just creates duplicate rows (same as any other manual content add),
// no special guard — matches how every other "add content" action in the app works.
async function loadSampleAdventure(campaignId, adventureId) {
  const adventure = SAMPLE_ADVENTURES.find(a => a.id === adventureId);
  if (!adventure) return null;

  for (const loc of adventure.locations) {
    await DB.put('lore_pages', { id: uid(), campaignId, title: loc.title, category: loc.category, body: loc.body, createdAt: nowIso(), updatedAt: nowIso() });
  }
  for (const npc of adventure.npcs) {
    await DB.put('npcs', { id: uid(), campaignId, name: npc.name, role: npc.role, disposition: 0, locationId: null, traits: npc.traits, speakingStyle: '', statBlockId: null, dialogueBankId: null, isHidden: false, notes: '' });
  }
  const ts = nowIso();
  const quest = { id: uid(), campaignId, title: adventure.quest.title, summary: adventure.quest.summary, status: 'active', giverNpcId: null, rewardLootTableId: null, createdAt: ts, updatedAt: ts };
  await DB.put('quests', quest);
  for (let i = 0; i < adventure.quest.objectives.length; i++) {
    await DB.put('quest_objectives', { id: uid(), questId: quest.id, campaignId, text: adventure.quest.objectives[i], status: 'pending', order: i });
  }
  for (const m of adventure.monsters) {
    await DB.put('monsters', makeMonster({
      campaignId, name: m.name, ac: m.ac, hpMax: m.hpMax, attackName: m.attackName, attackBonus: m.attackBonus, damageDice: m.damageDice, damageType: m.damageType,
      attackCount: m.attackCount, savingThrows: m.savingThrows, resistances: m.resistances, immunities: m.immunities, vulnerabilities: m.vulnerabilities
    }));
  }
  await DB.put('journal_entries', { id: uid(), campaignId, title: `DM Notes: ${adventure.title}`, body: adventure.dmNotes, tags: ['adventure', adventure.id], isPrivateDM: true, createdAt: nowIso() });
  await DB.put('log_entries', makeLogEntry({ campaignId, type: 'narration', speakerType: 'dm_scripted', text: adventure.premise }));
  await addCampaignRecentEvent(campaignId, `Began the adventure "${adventure.title}".`);

  return { npcCount: adventure.npcs.length, locationCount: adventure.locations.length, monsterCount: adventure.monsters.length, questTitle: quest.title };
}

/* ---- Encounter core: rest mechanics, condition reminders, difficulty heuristic ---- */
// Mirrored 1:1 from src/encounter-core.mjs (see tests/encounter-core.test.mjs).
// If you change behavior here, mirror the change in src/encounter-core.mjs too.
function longRestChanges(char) {
  const spellSlots = {};
  for (const [lvl, slot] of Object.entries(char.spellSlots || {})) spellSlots[lvl] = { max: slot.max, current: slot.max };
  return { hp: { current: char.hp.max, max: char.hp.max, temp: 0 }, spellSlots, conditions: [] };
}
function shortRestChanges(char, healAmount) {
  const current = Math.min(char.hp.max, char.hp.current + Math.max(0, healAmount));
  return { hp: { current, max: char.hp.max, temp: char.hp.temp } };
}
function hasSpellSlot(char, level) {
  const slot = char && char.spellSlots && char.spellSlots[level];
  return !!(slot && slot.current > 0);
}
function consumeSpellSlot(char, level) {
  if (!hasSpellSlot(char, level)) return false;
  char.spellSlots[level].current -= 1;
  return true;
}
const CONDITION_LIBRARY = {
  prone: 'Attacks against them from nearby have the edge; their own attacks don\'t.',
  restrained: 'Can\'t move. Attacks against them have the edge; their own attacks don\'t.',
  stunned: 'Can\'t act or move. Attacks against them have the edge.',
  poisoned: 'Their attacks and checks are hindered.',
  frightened: 'Can\'t willingly move closer to what scares them; checks near it are hindered.',
  charmed: 'Can\'t target the charmer with harmful actions.',
  blinded: 'Can\'t see. Their attacks are hindered; attacks against them have the edge.',
  deafened: 'Can\'t hear.',
  grappled: 'Speed becomes 0.',
  incapacitated: 'Can\'t take actions or reactions.',
  exhausted: 'Rising penalty to rolls the more exhausted they get.',
  invisible: 'Can\'t be seen without special means. Their attacks have the edge; attacks against them are hindered.'
};
function getConditionReminder(name) {
  if (!name) return null;
  return CONDITION_LIBRARY[String(name).trim().toLowerCase()] || null;
}
function threatScore(monster) {
  const bonus = parseInt(String(monster.attackBonus ?? '+0').replace(/[^\d-]/g, '')) || 0;
  return (monster.hpMax || monster.hp || 0) * (1 + Math.max(0, bonus) / 10);
}
function partyBudget(levels) {
  return levels.reduce((sum, lvl) => sum + Math.max(1, lvl) * 15, 0);
}
function assessEncounterDifficulty(levels, monsters) {
  const budget = partyBudget(levels);
  const threat = monsters.reduce((sum, m) => sum + threatScore(m), 0);
  const ratio = budget > 0 ? threat / budget : (threat > 0 ? Infinity : 0);
  let label;
  if (ratio < 0.5) label = 'Easy';
  else if (ratio < 1) label = 'Moderate';
  else if (ratio < 1.5) label = 'Hard';
  else label = 'Deadly';
  return { budget, threat, ratio, label };
}

function toast(msg, kind) {
  const region = document.getElementById('toastRegion');

  el.className = 'toast' + (kind ? ' ' + kind : '');

let activeModalCleanup = null;

  closeModal();

  backdrop.className = 'modal-backdrop';

  backdrop.innerHTML = `<div class="modal-sheet">${innerHtml}</div>`;

  activeModalCleanup = () => backdrop.remove();
}

  const el = document.getElementById('activeModal');
  if (el) el.remove();

}

const PORTRAIT_GALLERY = Array.from({ length: 25 }, (_, i) => `assets/portraits/bust-${String(i + 1).padStart(2, '0')}.jpg`);

async function urlToDataUrl(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('fetch failed');
  const blob = await resp.blob();
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

/* ---------- 5. ROUTER / APP SHELL ---------- */
const Router = {
  route: { name: 'landing', params: {} },
  parse() {
    const hash = location.hash.replace(/^#\/?/, '');
    const parts = hash.split('/').filter(Boolean);
    if (parts.length === 0) return { name: 'landing', params: {} };
    if (parts[0] === 'campaigns' && parts.length === 1) return { name: 'campaignList', params: {} };
    if (parts[0] === 'campaigns' && parts[1] && parts.length === 2) return { name: 'campaignDetail', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'characters' && parts[3] === 'new') return { name: 'characterNew', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'characters' && parts[3]) return { name: 'characterSheet', params: { campaignId: parts[1], characterId: parts[3] } };
    if (parts[0] === 'campaigns' && parts[2] === 'table') return { name: 'table', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'bots') return { name: 'botSettings', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'encounters' && parts[3] === 'new') return { name: 'encounterNew', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'encounters' && parts[3]) return { name: 'combat', params: { campaignId: parts[1], encounterId: parts[3] } };
    if (parts[0] === 'campaigns' && parts[2] === 'maps' && parts.length === 3) return { name: 'mapList', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'maps' && parts[3]) return { name: 'mapView', params: { campaignId: parts[1], mapId: parts[3] } };
    if (parts[0] === 'campaigns' && parts[2] === 'library') return { name: 'library', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'dm') return { name: 'dmDashboard', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'npcs') return { name: 'npcManager', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'quests') return { name: 'questTracker', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'journal') return { name: 'journalLore', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'handouts') return { name: 'handouts', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'xp') return { name: 'xpLoot', params: { campaignId: parts[1] } };
    if (parts[0] === 'campaigns' && parts[2] === 'timeline') return { name: 'timeline', params: { campaignId: parts[1] } };
    if (parts[0] === 'settings') return { name: 'settings', params: {} };
    return { name: 'landing', params: {} };
  },
  go(hash) { location.hash = hash; },
  async render() {
    this.route = this.parse();
    const app = document.getElementById('app');
    app.innerHTML = shellHtml(this.route);
    wireBottomNav(this.route);
    const main = document.getElementById('screenRoot');
    try {
      switch (this.route.name) {
        case 'landing': await ScreenLanding(main); break;
        case 'campaignList': await ScreenCampaignList(main); break;
        case 'campaignDetail': await ScreenCampaignDetail(main, this.route.params.campaignId); break;
        case 'characterNew': await ScreenCharacterWizard(main, this.route.params.campaignId); break;
        case 'characterSheet': await ScreenCharacterSheet(main, this.route.params.campaignId, this.route.params.characterId); break;
        case 'table': await ScreenTable(main, this.route.params.campaignId); break;
        case 'botSettings': await ScreenBotSettings(main, this.route.params.campaignId); break;
        case 'encounterNew': await ScreenEncounterBuilder(main, this.route.params.campaignId); break;
        case 'combat': await ScreenCombat(main, this.route.params.campaignId, this.route.params.encounterId); break;
        case 'mapList': await ScreenMapList(main, this.route.params.campaignId); break;
        case 'mapView': await ScreenMapView(main, this.route.params.campaignId, this.route.params.mapId); break;
        case 'library': await ScreenHomebrewLibrary(main, this.route.params.campaignId); break;
        case 'dmDashboard': await ScreenDmDashboard(main, this.route.params.campaignId); break;
        case 'npcManager': await ScreenNpcManager(main, this.route.params.campaignId); break;
        case 'questTracker': await ScreenQuestTracker(main, this.route.params.campaignId); break;
        case 'journalLore': await ScreenJournalLore(main, this.route.params.campaignId); break;
        case 'handouts': await ScreenHandouts(main, this.route.params.campaignId); break;
        case 'xpLoot': await ScreenXpLoot(main, this.route.params.campaignId); break;
        case 'timeline': await ScreenTimeline(main, this.route.params.campaignId); break;
        case 'settings': await ScreenSettings(main); break;
        default: main.innerHTML = emptyState('❓', 'Unknown screen');
      }
    } catch (err) {
      console.error(err);
      main.innerHTML = errorState(err);
    }
  }
};

function shellHtml(route) {
  const titles = { landing: 'FableTable Solo', campaignList: 'Campaigns', campaignDetail: 'Campaign', characterNew: 'New Character', characterSheet: 'Character Sheet', table: 'Table', botSettings: 'Bot Settings', encounterNew: 'New Encounter', combat: 'Combat', mapList: 'Maps', mapView: 'Map', library: 'Homebrew Library', dmDashboard: 'DM Dashboard', npcManager: 'NPC Manager', questTracker: 'Quest Tracker', journalLore: 'Journal & Lore', handouts: 'Handouts', xpLoot: 'XP & Loot', timeline: 'Timeline', settings: 'Settings' };
  const showBack = route.name !== 'landing' && route.name !== 'campaignList';
  return `
    <header class="topbar">
      ${showBack ? `<button class="icon-btn" id="navBack" aria-label="Back">←</button>` : `<span style="width:40px"></span>`}
      <h1>${escapeHtml(titles[route.name] || 'FableTable Solo')}</h1>
      <button class="icon-btn" id="navSettings" aria-label="Settings">⚙</button>
    </header>
    <main class="screen" id="screenRoot"></main>
    <nav class="bottomnav">
      <button data-nav="landing"><span class="ico">🏠</span>Home</button>
      <button data-nav="campaignList"><span class="ico">📜</span>Campaigns</button>
      <button data-nav="settings"><span class="ico">⚙</span>Settings</button>
    </nav>
  `;
}

function wireBottomNav(route) {
  document.querySelectorAll('nav.bottomnav button').forEach(btn => {
    const target = btn.getAttribute('data-nav');
    btn.classList.toggle('active', target === route.name || (target === 'campaignList' && route.name === 'campaignDetail'));
    btn.onclick = () => Router.go(target === 'landing' ? '#/' : target === 'campaignList' ? '#/campaigns' : '#/settings');
  });
  const back = document.getElementById('navBack');
  if (back) back.onclick = () => history.back();
  const settingsBtn = document.getElementById('navSettings');
  if (settingsBtn) settingsBtn.onclick = () => Router.go('#/settings');
}

function emptyState(icon, text, sub) {
  return `<div class="empty-state"><div class="big-ico">${icon}</div><p>${escapeHtml(text)}</p>${sub ? `<p class="hint">${escapeHtml(sub)}</p>` : ''}</div>`;
}
function errorState(err) {
  return `<div class="empty-state"><div class="big-ico">⚠️</div><p>Something went wrong loading this screen.</p><p class="hint">${escapeHtml(err && err.message ? err.message : String(err))}</p></div>`;
}
function disclaimerFooter() {
  return `<p class="disclaimer-footer">FableTable Solo is an independent, unofficial fan-made project. Not affiliated with, endorsed by, or sponsored by Wizards of the Coast.</p>`;
}

function openCampaignWizard() {
  const state = { name: '', description: '', rulesProfile: 'legacy', automationLevel: 'medium', aiDmEnabled: false, theme: getActiveTheme(), playMode: 'solo_party' };
  let step = 0;
  const steps = ['Basics', 'Rules', 'Automation', 'Play mode', 'Theme'];

  function render() {
    openModal(`
      <div class="stepper">${steps.map((_, i) => `<div class="dot ${i < step ? 'done' : i === step ? 'active' : ''}"></div>`).join('')}</div>
      <h2>${steps[step]}</h2>
      <div id="wizBody"></div>
      <div class="row" style="margin-top:1rem">
        ${step > 0 ? `<button class="btn block" id="wizBack">Back</button>` : `<button class="btn block" id="wizCancel">Cancel</button>`}
        <button class="btn primary block" id="wizNext">${step === steps.length - 1 ? 'Create Campaign' : 'Next'}</button>
      </div>
    `, (rootEl) => {
      const body = rootEl.querySelector('#wizBody');
      body.innerHTML = wizardStepHtml();
      wireWizardStep(body);
      const backBtn = rootEl.querySelector('#wizBack');
      if (backBtn) backBtn.onclick = () => { step--; render(); };
      const cancelBtn = rootEl.querySelector('#wizCancel');
      if (cancelBtn) cancelBtn.onclick = () => closeModal();
      rootEl.querySelector('#wizNext').onclick = async () => {
        if (step === 0 && !state.name.trim()) { toast('Give your campaign a name first.', 'danger'); return; }
        if (step < steps.length - 1) { step++; render(); return; }
        const campaign = makeCampaign(state);
        const errs = validateCampaign(campaign);
        if (errs.length) { toast(errs.join(' '), 'danger'); return; }
        await DB.put('campaigns', campaign);
        closeModal();
        toast('Campaign created.', 'success');
        Router.go('#/campaigns/' + campaign.id);
      };
    });
  }

  function wizardStepHtml() {
    if (step === 0) return `
      <div class="field"><label for="wfName">Campaign name</label><input type="text" id="wfName" value="${escapeHtml(state.name)}" placeholder="The Ashwake Reaches"></div>
      <div class="field"><label for="wfDesc">Description</label><textarea id="wfDesc" placeholder="A one or two line pitch for this campaign.">${escapeHtml(state.description)}</textarea></div>
    `;
    if (step === 1) return `
      <div class="field">
        <label>Rules profile</label>
        <div class="col">
          ${radioCard('rulesProfile', 'legacy', 'Legacy 5E-compatible', 'Classic-style rules baseline.', state.rulesProfile === 'legacy')}
          ${radioCard('rulesProfile', 'modern', 'Modern 5E-compatible', 'Updated-style rules baseline.', state.rulesProfile === 'modern')}
        </div>
      </div>
    `;
    if (step === 2) return `
      <div class="field">
        <label>Automation level</label>
        <div class="col">
          ${radioCard('automationLevel', 'light', 'Light', 'Dice, HP, notes — you make most rulings.', state.automationLevel === 'light')}
          ${radioCard('automationLevel', 'medium', 'Medium', 'Checks, attacks, saves, conditions auto-resolve.', state.automationLevel === 'medium')}
          ${radioCard('automationLevel', 'heavy', 'Heavy', 'Adds spell effects, AoE, movement enforcement.', state.automationLevel === 'heavy')}
        </div>
      </div>
      <div class="field row between" style="align-items:center">
        <label style="margin:0">Scripted AI DM</label>
        <button class="btn sm ${state.aiDmEnabled ? 'primary' : ''}" id="wfAiDm">${state.aiDmEnabled ? 'Enabled' : 'Disabled'}</button>
      </div>
    `;
    if (step === 3) return `
      <div class="field">
        <label>Play mode</label>
        <div class="col">
          ${PLAY_MODES.map(p => radioCard('playMode', p.id, p.label, '', state.playMode === p.id)).join('')}
        </div>
      </div>
    `;
    if (step === 4) return `
      <div class="field">
        <label>Theme</label>
        <div class="theme-swatch-row">
          ${THEMES.map(t => `
            <div class="theme-swatch ${state.theme === t.id ? 'selected' : ''}" data-theme-pick="${t.id}">
              <div class="sw-preview">${t.swatches.map(c => `<span style="background:${c}"></span>`).join('')}</div>
              ${t.label}
            </div>
          `).join('')}
        </div>
      </div>
    `;
    return '';
  }

  function radioCard(name, value, title, desc, checked) {
    return `
      <label class="card tap" style="margin-bottom:.5rem; ${checked ? 'border-color:var(--accent)' : ''}" data-radio="${name}" data-value="${value}">
        <div class="row between"><strong>${escapeHtml(title)}</strong>${checked ? '<span>✓</span>' : ''}</div>
        ${desc ? `<p style="margin:.2rem 0 0">${escapeHtml(desc)}</p>` : ''}
      </label>
    `;
  }

  function wireWizardStep(body) {
    if (step === 0) {
      body.querySelector('#wfName').oninput = (e) => { state.name = e.target.value; };
      body.querySelector('#wfDesc').oninput = (e) => { state.description = e.target.value; };
    }
    body.querySelectorAll('[data-radio]').forEach(el => {
      el.onclick = () => {
        const field = el.getAttribute('data-radio');
        state[field] = el.getAttribute('data-value');
        body.innerHTML = wizardStepHtml();
        wireWizardStep(body);
      };
    });
    const aiDmBtn = body.querySelector('#wfAiDm');
    if (aiDmBtn) aiDmBtn.onclick = () => { state.aiDmEnabled = !state.aiDmEnabled; body.innerHTML = wizardStepHtml(); wireWizardStep(body); };
    body.querySelectorAll('[data-theme-pick]').forEach(el => {
      el.onclick = () => { state.theme = el.getAttribute('data-theme-pick'); body.innerHTML = wizardStepHtml(); wireWizardStep(body); };
    });
  }

  render();
}

async function ScreenCampaignDetail(root, campaignId) {
  const campaign = await DB.get('campaigns', campaignId);
  if (!campaign) { root.innerHTML = emptyState('❓', 'Campaign not found'); return; }
  campaign.lastPlayedAt = nowIso();
  await DB.put('campaigns', campaign);

  const characters = await DB.getAllByIndex('characters', 'campaignId', campaignId);
  const playerChars = characters.filter(c => c.controlledBy === 'player');
  const botChars = characters.filter(c => c.controlledBy === 'bot');
  const bots = await DB.getAllByIndex('bots', 'campaignId', campaignId);

        <button class="icon-btn" id="editCampaignBtn">✎</button>

        <span class="badge">${campaign.rulesProfile === 'legacy' ? 'Legacy rules' : 'Modern rules'}</span>
        <span class="badge accent">${campaign.automationLevel} automation</span>
        <span class="badge">${campaign.aiDmEnabled ? 'AI DM on' : 'AI DM off'}</span>
        ${currentMapName ? `<span class="badge">📍 ${escapeHtml(currentMapName)}</span>` : ''}

      : `<button class="btn block" id="startEncounterBtn">⚔ Start Encounter</button>`}
    <div class="row wrap" style="margin-top:.5rem">
      <button class="btn" id="mapsBtn">🗺 Maps</button>
      <button class="btn" id="dmDashboardBtn">🛡 DM Dashboard</button>
    </div>

    <div class="section-title">Your character${playerChars.length === 1 ? '' : 's'}</div>
    ${playerChars.length ? playerChars.map(c => characterCardHtml(c, campaignId)).join('') : emptyState('🧙', 'No player character yet')}
    <div class="row wrap">
      <button class="btn" id="newCharBtn">+ New Character</button>
      <button class="btn" id="importCharBtn">⇧ Import Character</button>
    </div>
    <input type="file" id="importCharFile" accept="application/json" style="display:none">

    <div class="section-title row between" style="align-items:center">
      <span>Bot party (${botChars.length})</span>
      ${botChars.length ? `<button class="icon-btn" id="botSettingsBtn" title="Bot Settings">⚙</button>` : ''}
    </div>
    ${botChars.length ? botChars.map(c => characterCardHtml(c, campaignId, bots.find(b => b.characterId === c.id))).join('') : emptyState('🤖', 'No bots yet', 'Generate a party to fill out your table.')}
    <div class="row wrap">
      <button class="btn" id="fillPartyBtn">⚡ Fill Party with Bots</button>
      <button class="btn" id="addOneBotBtn">+ Add One Bot</button>
    </div>

    <div class="section-title">Danger zone</div>
    <div class="row wrap">
      <button class="btn" id="exportCampaignBtn">Export JSON</button>
      <button class="btn danger" id="deleteCampaignBtn">Delete Campaign</button>
    </div>
    ${disclaimerFooter()}
  `;

  root.querySelector('#newCharBtn').onclick = () => Router.go(`#/campaigns/${campaignId}/characters/new`);
  root.querySelector('#enterTableBtn').onclick = () => Router.go(`#/campaigns/${campaignId}/table`);
  const startEncBtn = root.querySelector('#startEncounterBtn');
  if (startEncBtn) startEncBtn.onclick = () => Router.go(`#/campaigns/${campaignId}/encounters/new`);
  const resumeEncBtn = root.querySelector('#resumeEncounterBtn');
  if (resumeEncBtn) resumeEncBtn.onclick = () => Router.go(`#/campaigns/${campaignId}/encounters/${activeEncounter.id}`);
  root.querySelector('#mapsBtn').onclick = () => Router.go(`#/campaigns/${campaignId}/maps`);
  root.querySelector('#dmDashboardBtn').onclick = () => Router.go(`#/campaigns/${campaignId}/dm`);
  root.querySelectorAll('[data-character-id]').forEach(el => {
    el.onclick = () => Router.go(`#/campaigns/${campaignId}/characters/${el.getAttribute('data-character-id')}`);
  });
  root.querySelector('#editCampaignBtn').onclick = () => openCampaignEditModal(campaign);
  root.querySelector('#exportCampaignBtn').onclick = () => exportCampaignJson(campaignId);
  const botSettingsBtn = root.querySelector('#botSettingsBtn');
  if (botSettingsBtn) botSettingsBtn.onclick = () => Router.go(`#/campaigns/${campaignId}/bots`);
  root.querySelector('#fillPartyBtn').onclick = async () => {
    const target = clamp(4 - botChars.length, 1, 4);
    await fillBotParty(campaignId, target);
    toast(`Added ${target} bot${target === 1 ? '' : 's'} to the party.`, 'success');
    Router.render();
  };
  root.querySelector('#addOneBotBtn').onclick = async () => {
    await createBot(campaignId);
    toast('Bot added.', 'success');
    Router.render();
  };
  root.querySelector('#importCharBtn').onclick = () => root.querySelector('#importCharFile').click();
  root.querySelector('#importCharFile').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const imported = { ...parsed, id: uid(), campaignId, createdAt: nowIso(), updatedAt: nowIso() };
      const errs = validateCharacter(imported);
      if (errs.length) { toast('Import failed: ' + errs.join(' '), 'danger'); return; }
      await DB.put('characters', imported);
      toast(`Imported "${imported.name}".`, 'success');
      Router.render();
    } catch (err) {
      toast('Import failed: file is not valid character JSON.', 'danger');
    }
    e.target.value = '';
  };
  root.querySelector('#deleteCampaignBtn').onclick = async () => {
    const doExport = await confirmDialog(`Export a backup of "${campaign.name}" before deleting?`, { okLabel: 'Export first' });
    if (doExport) await exportCampaignJson(campaignId);
    const reallyDelete = await confirmDialog(`Permanently delete "${campaign.name}" and all its data?`, { okLabel: 'Delete', danger: true });
    if (!reallyDelete) return;
    for (const c of characters) await DB.delete('characters', c.id);
    await DB.delete('campaigns', campaignId);
    toast('Campaign deleted.', 'success');
    Router.go('#/campaigns');
  };
}
