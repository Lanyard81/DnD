/* ---- Character wizard ---- */
async function ScreenCharacterWizard(root, campaignId) {
  const campaign = await DB.get('campaigns', campaignId);
  if (!campaign) { root.innerHTML = emptyState('❓', 'Campaign not found'); return; }
  const char = makeCharacter({ campaignId, controlledBy: 'player' });
  const homebrewFeatures = await DB.getAllByIndex('features', 'campaignId', campaignId);
  const speciesOptions = [...SUGGESTED_SPECIES, ...homebrewFeatures.filter(f => f.source === 'species').map(f => f.name)];
  const classOptions = [...SUGGESTED_CLASSES, ...homebrewFeatures.filter(f => f.source === 'class').map(f => f.name)];
  const backgroundOptions = [...SUGGESTED_BACKGROUNDS, ...homebrewFeatures.filter(f => f.source === 'background').map(f => f.name)];
  let step = 0;
  const steps = ['Identity', 'Ability scores', 'Combat basics', 'Background'];

  function render() {
    root.innerHTML = `
      <div class="stepper">${steps.map((_, i) => `<div class="dot ${i < step ? 'done' : i === step ? 'active' : ''}"></div>`).join('')}</div>
      <h2>${steps[step]}</h2>
      <div id="cwBody"></div>
      <div class="row" style="margin-top:1rem">
        ${step > 0 ? `<button class="btn block" id="cwBack">Back</button>` : `<button class="btn block" id="cwCancel">Cancel</button>`}
        <button class="btn primary block" id="cwNext">${step === steps.length - 1 ? 'Create Character' : 'Next'}</button>
      </div>
    `;
    const body = document.getElementById('cwBody');
    body.innerHTML = stepHtml();
    wireStep(body);
    const backBtn = document.getElementById('cwBack');
    if (backBtn) backBtn.onclick = () => { step--; render(); };
    const cancelBtn = document.getElementById('cwCancel');
    if (cancelBtn) cancelBtn.onclick = () => Router.go(`#/campaigns/${campaignId}`);
    document.getElementById('cwNext').onclick = async () => {
      if (step === 0 && !char.name.trim()) { toast('Give your character a name first.', 'danger'); return; }
      if (step < steps.length - 1) { step++; render(); return; }
      await finalizeAndSave();
    };
  }

  async function finalizeAndSave() {
    char.proficiencyBonus = profBonusForLevel(char.level);
    char.initiativeBonus = abilityMod(char.abilities.dex);
    const errs = validateCharacter(char);
    if (errs.length) { toast(errs.join(' '), 'danger'); return; }
    await DB.put('characters', char);
    toast('Character created.', 'success');
    Router.go(`#/campaigns/${campaignId}/characters/${char.id}`);
  }

  function openPregenPicker() {
    openModal(`
      <h2>Start from a pregenerated character</h2>
      <p class="hint">Fully editable afterward — this just gives you a running start.</p>
      <div class="col">
        ${PREGEN_CHARACTERS.map((p, i) => `
          <div class="card tap" data-pregen-pick="${i}">
            <div class="row between"><strong>${escapeHtml(p.name)}</strong><span class="badge">Lv ${p.level}</span></div>
            <p style="margin:.3rem 0 0">${escapeHtml(p.species)} · ${escapeHtml(p.class)}</p>
            <p class="hint" style="margin-top:.3rem">${escapeHtml(p.personalityTraits)}</p>
          </div>
        `).join('')}
      </div>
      <button class="btn block" id="pregenCancel" style="margin-top:.4rem">Cancel</button>
    `, (rootEl) => {
      rootEl.querySelector('#pregenCancel').onclick = closeModal;
      rootEl.querySelectorAll('[data-pregen-pick]').forEach(el => {
        el.onclick = async () => {
          const p = PREGEN_CHARACTERS[parseInt(el.getAttribute('data-pregen-pick'))];
          const built = buildCharacterFromPregen(p, campaignId, 'player');
          Object.assign(char, built, { id: char.id, campaignId, createdAt: char.createdAt });
          closeModal();
          await finalizeAndSave();
        };
      });
    });
  }

  function stepHtml() {
    if (step === 0) return `
      <button class="btn block" id="usePregenBtn" type="button">⚡ Start from a pregenerated character</button>
      <p class="hint" style="text-align:center;margin:.5rem 0 1rem">— or build your own —</p>
      <div class="field"><label for="cfName">Name</label><input type="text" id="cfName" value="${escapeHtml(char.name)}" placeholder="Character name"></div>
      <div class="grid2">
        <div class="field"><label for="cfSpecies">Species</label><input type="text" id="cfSpecies" list="speciesList" value="${escapeHtml(char.species)}"></div>
        <div class="field"><label for="cfClass">Class</label><input type="text" id="cfClass" list="classList" value="${escapeHtml(char.class)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="cfSubclass">Subclass</label><input type="text" id="cfSubclass" value="${escapeHtml(char.subclass)}"></div>
        <div class="field"><label for="cfLevel">Level</label><input type="number" id="cfLevel" min="1" max="20" value="${char.level}"></div>
      </div>
      <datalist id="speciesList">${speciesOptions.map(s => `<option value="${escapeHtml(s)}">`).join('')}</datalist>
      <datalist id="classList">${classOptions.map(s => `<option value="${escapeHtml(s)}">`).join('')}</datalist>
    `;
    if (step === 1) return `
      <p class="hint">Standard array shown as defaults — adjust as you like. Modifiers shown update automatically.</p>
      <div class="grid3">
        ${ABILITIES.map(a => `
          <div class="statbox">
            <div class="label">${a.toUpperCase()}</div>
            <input type="number" id="ab_${a}" value="${char.abilities[a]}" style="text-align:center;margin-top:.3rem" min="1" max="30">
            <div class="sub" id="abmod_${a}">${fmtMod(abilityMod(char.abilities[a]))}</div>
          </div>
        `).join('')}
      </div>
    `;
    if (step === 2) return `
      <div class="grid2">
        <div class="field"><label for="cfHpMax">Max HP</label><input type="number" id="cfHpMax" value="${char.hp.max}" min="1"></div>
        <div class="field"><label for="cfAc">Armor Class</label><input type="number" id="cfAc" value="${char.ac}" min="1"></div>
        <div class="field"><label for="cfSpeed">Speed</label><input type="number" id="cfSpeed" value="${char.speed}" min="0"></div>
        <div class="field"><label>Proficiency Bonus</label><input type="text" value="+${profBonusForLevel(char.level)}" disabled></div>
      </div>
    `;
    if (step === 3) return `
      <div class="field"><label for="cfBg">Background</label><input type="text" id="cfBg" list="bgList" value="${escapeHtml(char.background)}"></div>
      <div class="field"><label for="cfPersonality">Personality traits</label><textarea id="cfPersonality">${escapeHtml(char.personalityTraits)}</textarea></div>
      <datalist id="bgList">${backgroundOptions.map(s => `<option value="${escapeHtml(s)}">`).join('')}</datalist>
    `;
    return '';
  }

  function wireStep(body) {
    if (step === 0) {
      body.querySelector('#usePregenBtn').onclick = () => openPregenPicker();
      body.querySelector('#cfName').oninput = e => char.name = e.target.value;
      body.querySelector('#cfSpecies').oninput = e => char.species = e.target.value;
      body.querySelector('#cfClass').oninput = e => char.class = e.target.value;
      body.querySelector('#cfSubclass').oninput = e => char.subclass = e.target.value;
      body.querySelector('#cfLevel').oninput = e => char.level = clamp(parseInt(e.target.value) || 1, 1, 20);
    }
    if (step === 1) {
      ABILITIES.forEach(a => {
        body.querySelector('#ab_' + a).oninput = e => {
          char.abilities[a] = clamp(parseInt(e.target.value) || 10, 1, 30);
          body.querySelector('#abmod_' + a).textContent = fmtMod(abilityMod(char.abilities[a]));
        };
      });
    }
    if (step === 2) {
      body.querySelector('#cfHpMax').oninput = e => { char.hp.max = parseInt(e.target.value) || 1; char.hp.current = char.hp.max; };
      body.querySelector('#cfAc').oninput = e => char.ac = parseInt(e.target.value) || 10;
      body.querySelector('#cfSpeed').oninput = e => char.speed = parseInt(e.target.value) || 0;
    }
    if (step === 3) {
      body.querySelector('#cfBg').oninput = e => char.background = e.target.value;
      body.querySelector('#cfPersonality').oninput = e => char.personalityTraits = e.target.value;
    }
  }

  render();
}

/* ---- Backup: full campaign export/import ---- */
// Payload key -> IndexedDB store name (payload uses DATA_MODEL.md's export
// shape, camelCased; stores use their snake_case names).
const PAYLOAD_TO_STORE = {
  characters: 'characters', bots: 'bots', npcs: 'npcs', monsters: 'monsters',
  items: 'items', spells: 'spells', features: 'features', effects: 'effects', conditions: 'conditions',
  encounters: 'encounters', maps: 'maps', tokens: 'tokens', fogOfWar: 'fog_of_war_state',
  quests: 'quests', questObjectives: 'quest_objectives', journalEntries: 'journal_entries',
  handouts: 'handouts', lorePages: 'lore_pages', logEntries: 'log_entries', diceRolls: 'dice_rolls',
  combatLogs: 'combat_logs', eventLogs: 'event_logs', randomTables: 'random_tables', lootTables: 'loot_tables',
  botMemory: 'bot_memory', campaignMemory: 'campaign_memory'
};

async function gatherCampaignExportPayload(campaignId) {
  const campaign = await DB.get('campaigns', campaignId);
  const maps = await DB.getAllByIndex('maps', 'campaignId', campaignId);
  const fogNested = await Promise.all(maps.map(m => DB.getAllByIndex('fog_of_war_state', 'mapId', m.id)));

  const payload = { formatVersion: 1, exportedAt: nowIso(), campaign, maps, fogOfWar: fogNested.flat() };
  for (const key of Object.keys(PAYLOAD_TO_STORE)) {
    if (key === 'maps' || key === 'fogOfWar') continue;
    payload[key] = await DB.getAllByIndex(PAYLOAD_TO_STORE[key], 'campaignId', campaignId);
  }
  return payload;
}

function downloadJson(payload, filename) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function exportCampaignJson(campaignId) {
  const payload = await gatherCampaignExportPayload(campaignId);
  downloadJson(payload, `fabletable-${(payload.campaign.name || 'campaign').replace(/[^a-z0-9]+/gi, '_').toLowerCase()}.json`);
  toast('Campaign exported (full backup).', 'success');
}

async function importCampaignJsonFile(file) {
  let payload;
  try {
    payload = JSON.parse(await file.text());
  } catch (err) {
    toast('Import failed: file is not valid JSON.', 'danger');
    return null;
  }
  const errs = validateExportPayload(payload);
  if (errs.length) { toast('Import failed: ' + errs.join(' '), 'danger'); return null; }

  const remapped = remapCampaignExportIds(payload, uid);
  // Validated first, all-or-nothing from here: nothing above this line touched IndexedDB.
  await DB.put('campaigns', remapped.campaign);
  for (const [payloadKey, storeName] of Object.entries(PAYLOAD_TO_STORE)) {
    for (const row of (remapped[payloadKey] || [])) await DB.put(storeName, row);
  }
  toast(`Imported "${remapped.campaign.name}" as a new campaign.`, 'success');
  return remapped.campaign;
}

function showCopyrightWarning() {
  return confirmDialog('Only import content you have the right to use. FableTable Solo does not check imported files for copyrighted material — that responsibility is yours.', { okLabel: 'I understand, continue' });
}

async function importMarkdownAsJournalEntry(campaignId, file) {
  const ok = await showCopyrightWarning();
  if (!ok) return null;
  const text = await file.text();
  const title = file.name.replace(/\.md$/i, '') || 'Imported Entry';
  const entry = { id: uid(), campaignId, title, body: text, tags: ['imported'], isPrivateDM: false, createdAt: nowIso() };
  await DB.put('journal_entries', entry);
  toast(`Imported "${title}" as a journal entry.`, 'success');
  return entry;
}

/* ---- Content packs: homebrew-only export/import (lighter than a full campaign) ---- */
// Unlike a full campaign export, a content pack carries no `campaign` key and
// no cross-references between rows — each homebrew entry stands alone — so
// import is a simple "assign fresh id, attach to the target campaign" pass
// rather than needing the full FK-remapping machinery in backup-core.
async function gatherContentPack(campaignId) {
  const pack = { formatVersion: 1, exportedAt: nowIso(), contentPack: true };
  for (const [key, schema] of Object.entries(HOMEBREW_SCHEMAS)) {
    pack[key] = await DB.getAllByIndex(schema.store, 'campaignId', campaignId);
  }
  return pack;
}
async function exportContentPack(campaignId) {
  const campaign = await DB.get('campaigns', campaignId);
  const pack = await gatherContentPack(campaignId);
  downloadJson(pack, `fabletable-content-pack-${(campaign.name || 'campaign').replace(/[^a-z0-9]+/gi, '_').toLowerCase()}.json`);
  toast('Content pack exported.', 'success');
}
async function importContentPackFile(campaignId, file) {
  let payload;
  try { payload = JSON.parse(await file.text()); } catch (err) { toast('Import failed: file is not valid JSON.', 'danger'); return null; }
  const knownKeys = Object.keys(HOMEBREW_SCHEMAS).filter(k => Array.isArray(payload[k]));
  if (!knownKeys.length) { toast('Import failed: no recognized content in this file.', 'danger'); return null; }
  const ok = await showCopyrightWarning();
  if (!ok) return null;
  let count = 0;
  for (const key of knownKeys) {
    const schema = HOMEBREW_SCHEMAS[key];
    for (const row of payload[key]) {
      await DB.put(schema.store, { ...row, id: uid(), campaignId });
      count++;
    }
  }
  toast(`Imported ${count} homebrew ${count === 1 ? 'entry' : 'entries'}.`, 'success');
  return count;
}

/* ---------- 7. DICE TRAY + UNIFIED LOG HELPERS ---------- */

// Persists a dice roll and mirrors it into the unified session log in one step,
// so every roll — whether from the dice tray or a character sheet quick-roll —
// shows up consistently in both dice_rolls history and the log feed.
async function rollAndLog(campaignId, { actorType, actorId, actorName, formula, modifier, mode, purpose }) {
  let dice, total, formulaStr, appliedModifier, advantage = mode || 'none';
  if (formula) {
    const parsed = parseDiceFormula(formula);
    if (!parsed) { toast('Invalid dice formula. Try something like 2d6+3.', 'danger'); return null; }
    const result = rollFormula(parsed);
    dice = result.dice;
    total = result.total;
    formulaStr = formula;
    appliedModifier = parsed.modifier;
  } else {
    const result = rollD20(modifier || 0, advantage);
    dice = result.rolls;
    total = result.total;
    formulaStr = `1d20${modifier >= 0 ? '+' : ''}${modifier || 0}`;
    appliedModifier = modifier || 0;
  }
  const roll = makeDiceRoll({ campaignId, actorType, actorId, formula: formulaStr, dice, modifier: appliedModifier, total, purpose, advantage });
  await DB.put('dice_rolls', roll);
  const advText = advantage !== 'none' ? ` (${advantage})` : '';
  const text = `${actorName || 'Someone'} rolls ${purpose || formulaStr}${advText}: [${dice.join(', ')}]${appliedModifier ? ' ' + fmtMod(appliedModifier) : ''} = ${total}`;
  const entry = makeLogEntry({ campaignId, type: 'system', speakerType: actorType || 'player', speakerId: actorId, text });
  await DB.put('log_entries', entry);
  return roll;
}

function diceTrayHtml(state) {
  const dieSizes = [4, 6, 8, 10, 12, 20, 100];
  return `
    <div class="dice-grid">
      ${dieSizes.map(sides => `<button class="die-btn" data-quick-die="${sides}"><span>d${sides}</span><span class="die-label">tap to roll</span></button>`).join('')}
      <button class="die-btn" data-open-custom="1"><span>⚙</span><span class="die-label">custom</span></button>
    </div>
    <div class="adv-toggle-row">
      <button data-adv="none" class="${state.mode === 'none' ? 'active' : ''}">Normal</button>
      <button data-adv="advantage" class="${state.mode === 'advantage' ? 'active' : ''}">Advantage</button>
      <button data-adv="disadvantage" class="${state.mode === 'disadvantage' ? 'active' : ''}">Disadvantage</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:.4rem">Advantage/Disadvantage applies to the next d20 roll only.</p>
    <div id="rollResultSlot"></div>
  `;
}

function wireDiceTray(root, campaignId, state, onRoll) {
  root.querySelectorAll('[data-adv]').forEach(b => b.onclick = () => {
    state.mode = b.getAttribute('data-adv');
    root.querySelectorAll('[data-adv]').forEach(x => x.classList.toggle('active', x === b));
  });
  root.querySelectorAll('[data-quick-die]').forEach(b => b.onclick = async () => {
    const sides = parseInt(b.getAttribute('data-quick-die'));
    if (sides === 20 && state.mode !== 'none') {
      await animateAndRoll(root, campaignId, { modifier: 0, mode: state.mode, purpose: `d20 (${state.mode})` }, onRoll);
    } else {
      await animateAndRoll(root, campaignId, { formula: `1d${sides}`, purpose: `d${sides}` }, onRoll);
    }
  });
  const customBtn = root.querySelector('[data-open-custom]');
  if (customBtn) customBtn.onclick = () => openCustomRollModal(campaignId, state, onRoll);
}

async function animateAndRoll(root, campaignId, { formula, modifier, mode, purpose }, onRoll) {
  const slot = root.querySelector('#rollResultSlot');
  if (!slot) { await doRoll(); return; }
  slot.innerHTML = `<div class="roll-result-banner"><div class="rr-total rolling">?</div><div class="rr-detail">Rolling ${escapeHtml(purpose || formula)}…</div></div>`;
  const totalEl = slot.querySelector('.rr-total');
  let ticks = 0;
  const iv = setInterval(() => { totalEl.textContent = String(Math.ceil(Math.random() * 20)); ticks++; }, 60);
  await new Promise(r => setTimeout(r, 380));
  clearInterval(iv);
  const roll = await doRoll();
  if (!roll) { slot.innerHTML = ''; return; }
  totalEl.classList.remove('rolling');
  totalEl.textContent = String(roll.total);
  slot.querySelector('.rr-detail').textContent = `${purpose || formula}: [${roll.dice.join(', ')}]${roll.modifier ? ' ' + fmtMod(roll.modifier) : ''}`;

  async function doRoll() {
    return rollAndLog(campaignId, { actorType: 'player', actorId: null, actorName: 'You', formula, modifier, mode, purpose });
  }
  if (onRoll) onRoll();
}

function openCustomRollModal(campaignId, state, onRoll) {
  openModal(`
    <h2>Custom Roll</h2>
    <div class="field"><label for="crFormula">Formula</label><input type="text" id="crFormula" placeholder="e.g. 2d6+3" value=""></div>
    <p class="hint">Advantage/Disadvantage (currently: ${state.mode}) applies automatically if this is a single d20 roll.</p>
    <div class="row" style="margin-top:1rem">
      <button class="btn block" id="crCancel">Cancel</button>
      <button class="btn primary block" id="crRoll">Roll</button>
    </div>
  `, (rootEl) => {
    rootEl.querySelector('#crCancel').onclick = closeModal;
    rootEl.querySelector('#crRoll').onclick = async () => {
      const formula = rootEl.querySelector('#crFormula').value.trim();
      if (!parseDiceFormula(formula)) { toast('Invalid formula. Try something like 2d6+3 or 1d20.', 'danger'); return; }
      const parsed = parseDiceFormula(formula);
      const useMode = (parsed.count === 1 && parsed.sides === 20) ? state.mode : 'none';
      closeModal();
      if (useMode !== 'none') {
        const result = rollD20(parsed.modifier, useMode);
        const roll = makeDiceRoll({ campaignId, actorType: 'player', actorId: null, formula, dice: result.rolls, modifier: parsed.modifier, total: result.total, purpose: formula, advantage: useMode });
        await DB.put('dice_rolls', roll);
        const entry = makeLogEntry({ campaignId, type: 'system', speakerType: 'player', text: `You roll ${formula} (${useMode}): [${result.rolls.join(', ')}]${parsed.modifier ? ' ' + fmtMod(parsed.modifier) : ''} = ${result.total}` });
        await DB.put('log_entries', entry);
      } else {
        await rollAndLog(campaignId, { actorType: 'player', actorId: null, actorName: 'You', formula, purpose: formula });
      }
      if (onRoll) onRoll();
      toast('Rolled ' + formula + '.', 'success');
    };
  });
}

function logEntryHtml(e) {
  const speakerLabel = e.speakerType === 'system' ? 'System' : (e.speakerType === 'player' ? 'You' : e.speakerType);
  const time = new Date(e.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return `
    <div class="log-entry type-${e.type}">
      <div class="le-meta">${escapeHtml(speakerLabel)} · ${e.type} · ${time}</div>
      <div class="le-text">${escapeHtml(e.text)}</div>
    </div>
  `;
}

function logToMarkdown(campaignName, entries) {
  const lines = [`# ${campaignName} — Session Log`, ''];
  entries.slice().reverse().forEach(e => {
    const time = new Date(e.createdAt).toLocaleString();
    const speaker = e.speakerType === 'system' ? 'System' : (e.speakerType === 'player' ? 'You' : e.speakerType);
    if (e.type === 'emote') lines.push(`*${speaker} ${e.text}* — _${time}_`);
    else if (e.type === 'ooc') lines.push(`**(OOC)** ${speaker}: ${e.text} — _${time}_`);
    else lines.push(`**${speaker}:** ${e.text} — _${time}_`);
    lines.push('');
  });
  return lines.join('\n');
}

      for (const c of characters) { Object.assign(c, longRestChanges(c)); await DB.put('characters', c); }

      toast('Party fully rested.', 'success');

        const conMod = abilityMod(c.abilities.con);
        const result = rollFormula(`1d8${conMod >= 0 ? '+' : ''}${conMod}`);
        Object.assign(c.hp, shortRestChanges(c, result.total).hp);

        if (!char) continue;
        await postBotDialogue(campaignId, bot, char, 'scene_enter');
        await addBotRecentEvent(campaignId, bot.id, 'Was prompted at the table.');

      refreshLogFeed();
    };
    root.querySelector('#logPostBtn').onclick = async () => {
      const input = root.querySelector('#logInput');
      const text = input.value.trim();
      if (!text) return;

      const command = parseCommand(text);
      if (command.type && botChars.length) {
        const cmdEntry = makeLogEntry({ campaignId, type: 'ooc', speakerType: 'player', text: `You order the party: "${text}"` });
        await DB.put('log_entries', cmdEntry);
        const triggerByCommand = { focus: 'command_focus', hold: 'command_hold', flee: 'command_flee', use_item: 'command_use_item' };
        const trigger = triggerByCommand[command.type];
        for (const bot of bots) {
          const char = charById[bot.characterId];
          if (!char) continue;
          await postBotDialogue(campaignId, bot, char, trigger, { target: command.target || 'the target' });
          await addBotFact(campaignId, bot.id, 'lastCommand', command.type, ['command']);
          await addBotRecentEvent(campaignId, bot.id, `Player commanded: ${text}`);

      input.value = '';
      refreshLogFeed();
    };

      const all = await DB.getAllByIndex('log_entries', 'campaignId', campaignId);
      all.sort((a, b) => a.createdAt.localeCompare(b.createdAt));

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `fabletable-${(campaign.name || 'campaign').replace(/[^a-z0-9]+/gi, '_').toLowerCase()}-log.md`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast('Log exported as Markdown.', 'success');
    };
  }

  await render();
}

        <div class="card">
          <div class="row between">
            <strong>${escapeHtml(m.name)} ${m.qty > 1 ? `×${m.qty}` : ''}</strong>
            <button class="icon-btn" data-remove-monster="${i}">✕</button>
          </div>
          <p class="hint" style="margin-top:.2rem">HP ${m.hp} · AC ${m.ac} · ${escapeHtml(m.attackBonus)} / ${escapeHtml(m.damageDice)} ${escapeHtml(m.damageType)}</p>
        </div>
      `).join('') : '<p class="hint">No enemies added yet.</p>'}

      ${libraryMonsters.length ? `
        <div class="card">
          <div class="section-title" style="margin-top:0">Add from Monster Library</div>
          <div class="field"><select id="libraryMonsterSelect">${libraryMonsters.map(m => `<option value="${m.id}">${escapeHtml(m.name)} (AC ${m.ac}, ${m.hp.max} HP)</option>`).join('')}</select></div>
          <div class="row" style="gap:.5rem">
            <input type="number" id="libraryMonsterQty" value="1" min="1" max="12" style="width:5em">
            <button class="btn sm block" id="addFromLibraryBtn">+ Add</button>
          </div>
        </div>
      ` : ''}
      <div class="card">
        <div class="section-title" style="margin-top:0">Add custom enemy</div>
        <div class="field"><label for="mName">Name</label><input type="text" id="mName" placeholder="Goblin Skulker"></div>
        <div class="grid3">
          <div class="field"><label for="mHp">HP</label><input type="number" id="mHp" value="7" min="1"></div>
          <div class="field"><label for="mAc">AC</label><input type="number" id="mAc" value="13" min="1"></div>
          <div class="field"><label for="mQty">Qty</label><input type="number" id="mQty" value="1" min="1" max="12"></div>
        </div>
        <div class="grid3">
          <div class="field"><label for="mAtkBonus">Attack bonus</label><input type="text" id="mAtkBonus" value="+4"></div>
          <div class="field"><label for="mDmg">Damage</label><input type="text" id="mDmg" value="1d6+2"></div>
          <div class="field"><label for="mDmgType">Type</label><input type="text" id="mDmgType" value="piercing"></div>
        </div>
        <button class="btn sm block" id="addMonsterBtn">+ Add Enemy</button>
      </div>

      <button class="btn primary block" id="startBtn" style="margin-top:1rem">⚔ Start Encounter</button>
      <button class="btn block" id="cancelBtn">Cancel</button>
    `;
    root.querySelector('#encName').oninput = e => { encounterName = e.target.value; };
    root.querySelectorAll('[data-party-toggle]').forEach(el => {
      el.onclick = () => {
        const id = el.getAttribute('data-party-toggle');
        if (selected.has(id)) selected.delete(id); else selected.add(id);
        render();
      };
    });
    root.querySelectorAll('[data-remove-monster]').forEach(el => {
      el.onclick = () => { monsterDrafts.splice(parseInt(el.getAttribute('data-remove-monster')), 1); render(); };
    });
    const addFromLibraryBtn = root.querySelector('#addFromLibraryBtn');
    if (addFromLibraryBtn) addFromLibraryBtn.onclick = () => {
      const m = libraryMonsters.find(x => x.id === root.querySelector('#libraryMonsterSelect').value);
      if (!m) return;
      const action = m.actions[0] || {};
      monsterDrafts.push({
        libraryMonsterId: m.id,
        name: m.name, hp: m.hp.max, ac: m.ac,
        qty: clamp(parseInt(root.querySelector('#libraryMonsterQty').value) || 1, 1, 12),
        attackBonus: action.attackBonus || '+3', damageDice: action.damageDice || '1d6', damageType: action.damageType || 'bludgeoning'
      });
      render();
    };
    root.querySelector('#addMonsterBtn').onclick = () => {
      const name = root.querySelector('#mName').value.trim();
      if (!name) { toast('Give the enemy a name.', 'danger'); return; }
      monsterDrafts.push({
        name, hp: parseInt(root.querySelector('#mHp').value) || 1, ac: parseInt(root.querySelector('#mAc').value) || 10,
        qty: clamp(parseInt(root.querySelector('#mQty').value) || 1, 1, 12),
        attackBonus: root.querySelector('#mAtkBonus').value.trim() || '+3',
        damageDice: root.querySelector('#mDmg').value.trim() || '1d6',
        damageType: root.querySelector('#mDmgType').value.trim() || 'bludgeoning'
      });
      render();
    };
    root.querySelector('#cancelBtn').onclick = () => Router.go(`#/campaigns/${campaignId}`);
    root.querySelector('#startBtn').onclick = async () => {
      if (!selected.size) { toast('Select at least one party combatant.', 'danger'); return; }
      if (!monsterDrafts.length) { toast('Add at least one enemy.', 'danger'); return; }
      const partyCombatants = await Promise.all(characters.filter(c => selected.has(c.id)).map(c => combatantFromCharacter(c, botByCharId[c.id])));
      const encounter = await startEncounter(campaignId, encounterName, partyCombatants, monsterDrafts);
      toast('Combat started!', 'success');
      Router.go(`#/campaigns/${campaignId}/encounters/${encounter.id}`);
    };
  }

  render();
}

/* ---- Combat screen (initiative tracker) ---- */
async function ScreenCombat(root, campaignId, encounterId) {
  let encounter = await DB.get('encounters', encounterId);
  if (!encounter) { root.innerHTML = emptyState('❓', 'Encounter not found'); return; }
  const campaign = await DB.get('campaigns', campaignId);

  async function persist() { await DB.put('encounters', encounter); }

  async function checkCombatEnd() {
    const hpLookup = encounterHpLookup(encounter);
    const sideOf = encounterSideLookup(encounter);
    const partyDown = isSideDefeated(encounter.initiativeOrder, hpLookup, sideOf, 'party');
    const enemyDown = isSideDefeated(encounter.initiativeOrder, hpLookup, sideOf, 'enemy');
    if (partyDown || enemyDown) {
      encounter.status = 'completed';
      const text = enemyDown ? `🏆 Victory! The party has defeated all enemies.` : `💀 The party has fallen.`;
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'system', text }));
      const camp = await DB.get('campaigns', campaignId);
      camp.currentEncounterId = null;
      await DB.put('campaigns', camp);
      await persist();
      return true;
    }
    return false;
  }

  async function advance() {
    const hpLookup = encounterHpLookup(encounter);
    const { activeIndex, roundDelta } = advanceTurn(encounter.initiativeOrder, encounter.activeIndex, hpLookup);
    encounter.activeIndex = activeIndex;
    encounter.roundNumber += roundDelta;
    await persist();
    render();
  }

  async function render() {
    encounter = await DB.get('encounters', encounterId);
    const combatOver = encounter.status === 'completed';
    const activeId = encounter.initiativeOrder[encounter.activeIndex];
    const active = findCombatant(encounter, activeId);

    root.innerHTML = `
      ${combatOver ? `<div class="combat-over-banner"><h2 style="margin:0 0 .3rem">Combat Complete</h2><p style="margin:0">Review the log below, then return whenever you're ready.</p><button class="btn primary block" id="returnBtn" style="margin-top:.6rem">Return to Campaign</button></div>` : ''}
      <div class="round-banner">Round ${encounter.roundNumber}${!combatOver ? ` — ${escapeHtml(active.name)}'s turn` : ''}</div>
      <div class="turn-order-strip">
        ${encounter.initiativeOrder.map(id => {
          const c = findCombatant(encounter, id);
          const down = isCombatantDown(c.hp.current);
          return `<span class="tos-chip ${id === activeId && !combatOver ? 'active' : ''} ${down ? 'down' : ''}">${escapeHtml(c.name)} (${c.initiativeRoll})</span>`;
        }).join('')}
      </div>

      ${!combatOver ? `
        <div class="card">
          ${active.side === 'party' && !active.isBot ? `
            <div class="row wrap">
              <button class="btn primary" id="attackBtn">⚔ Attack</button>
              <button class="btn" id="endTurnBtn">End Turn ▶</button>
            </div>
          ` : `
            <div class="row wrap">
              <button class="btn primary" id="runBotTurnBtn">▶ Run Turn (${COMBAT_STYLE_INFO[active.combatStyle] ? COMBAT_STYLE_INFO[active.combatStyle].label : active.combatStyle} AI)</button>
              <button class="btn" id="endTurnBtn">End Turn ▶</button>
            </div>
          `}
        </div>
      ` : ''}

      <div class="section-title">Combatants</div>
      ${encounter.combatants.map(c => combatantCardHtml(c, c.id === activeId)).join('')}

      <button class="btn danger block" id="endCombatBtn" style="margin-top:1rem">🏳 End Combat</button>
    `;

    const returnBtn = root.querySelector('#returnBtn');
    if (returnBtn) returnBtn.onclick = () => Router.go(`#/campaigns/${campaignId}`);

    const attackBtn = root.querySelector('#attackBtn');
    if (attackBtn) attackBtn.onclick = () => openAttackModal(active);

    const runBotBtn = root.querySelector('#runBotTurnBtn');
    if (runBotBtn) runBotBtn.onclick = async () => {
      runBotBtn.disabled = true;
      await resolveBotTurn(encounter, active);
      await persist();
      if (await checkCombatEnd()) { render(); return; }
      await advance();
    };

    const endTurnBtn = root.querySelector('#endTurnBtn');
    if (endTurnBtn) endTurnBtn.onclick = () => advance();

    root.querySelector('#endCombatBtn').onclick = async () => {
      const ok = await confirmDialog('End this combat now?', { okLabel: 'End Combat', danger: true });
      if (!ok) return;
      encounter.status = 'completed';
      const camp = await DB.get('campaigns', campaignId);
      camp.currentEncounterId = null;
      await DB.put('campaigns', camp);
      await persist();
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'system', text: '🏳 Combat ended manually.' }));
      render();
    };

    // Per-combatant inline overrides: HP, AC, initiative roll, conditions, "set active".
    root.querySelectorAll('[data-hp-cur]').forEach(el => el.onchange = async () => {
      const c = findCombatant(encounter, el.getAttribute('data-hp-cur'));
      c.hp.current = clamp(parseInt(el.value) || 0, 0, 999);
      await persist();
      if (await checkCombatEnd()) render();
    });
    root.querySelectorAll('[data-hp-max]').forEach(el => el.onchange = async () => {
      const c = findCombatant(encounter, el.getAttribute('data-hp-max'));
      c.hp.max = Math.max(1, parseInt(el.value) || 1);
      await persist();
    });
    root.querySelectorAll('[data-ac-val]').forEach(el => el.onchange = async () => {
      const c = findCombatant(encounter, el.getAttribute('data-ac-val'));
      c.ac = parseInt(el.value) || 10;
      await persist();
    });
    root.querySelectorAll('[data-init-val]').forEach(el => el.onchange = async () => {
      const c = findCombatant(encounter, el.getAttribute('data-init-val'));
      c.initiativeRoll = parseInt(el.value) || 0;
      const sorted = sortInitiative(encounter.combatants.map(cc => ({ id: cc.id, roll: cc.initiativeRoll, dexMod: cc.initiativeBonus })));
      encounter.initiativeOrder = sorted.map(s => s.id);
      await persist();
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'override', speakerType: 'player', text: `Initiative overridden: ${c.name} now at ${c.initiativeRoll}.` }));
      render();
    });
    root.querySelectorAll('[data-set-active]').forEach(el => el.onclick = async () => {
      const id = el.getAttribute('data-set-active');
      encounter.activeIndex = encounter.initiativeOrder.indexOf(id);
      await persist();
      await DB.put('log_entries', makeLogEntry({ campaignId, type: 'override', speakerType: 'player', text: `Turn order overridden: it is now ${findCombatant(encounter, id).name}'s turn.` }));
      render();
    });
    root.querySelectorAll('[data-cond-add]').forEach(el => el.onclick = async () => {
      const cId = el.getAttribute('data-cond-add');
      const input = root.querySelector(`[data-cond-input="${cId}"]`);
      if (!input.value.trim()) return;
      findCombatant(encounter, cId).conditions.push({ conditionId: input.value.trim(), source: 'manual', roundsRemaining: null });
      await persist();
      render();
    });
    root.querySelectorAll('[data-cond-remove]').forEach(el => el.onclick = async () => {
      const [cId, idx] = el.getAttribute('data-cond-remove').split('|');
      findCombatant(encounter, cId).conditions.splice(parseInt(idx), 1);
      await persist();
      render();
    });
  }

  function openAttackModal(attacker) {
    const targets = encounter.combatants.filter(c => c.side !== attacker.side && !isCombatantDown(c.hp.current));
    if (!targets.length) { toast('No living targets.', 'danger'); return; }
    const attackOptions = attacker.attacks && attacker.attacks.length ? attacker.attacks : [getPrimaryAttack(attacker)];
    openModal(`
      <h2>${escapeHtml(attacker.name)} attacks</h2>
      <div class="field">
        <label>Attack</label>
        <select id="atkSelect">${attackOptions.map((a, i) => `<option value="${i}">${escapeHtml(a.name)} (${escapeHtml(a.attackBonus)}, ${escapeHtml(a.damageDice)})${a.attackCount > 1 ? ` — ×${a.attackCount}` : ''}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Target</label>
        <select id="tgtSelect">${targets.map(t => `<option value="${t.id}">${escapeHtml(t.name)} (AC ${t.ac}, ${t.hp.current}/${t.hp.max} HP)</option>`).join('')}</select>
      </div>
      <div class="row" style="margin-top:1rem">
        <button class="btn block" id="atkCancel">Cancel</button>
        <button class="btn primary block" id="atkGo">Roll Attack</button>
      </div>
    `, (rootEl) => {
      rootEl.querySelector('#atkCancel').onclick = closeModal;
      rootEl.querySelector('#atkGo').onclick = async () => {
        const atkIdx = parseInt(rootEl.querySelector('#atkSelect').value);
        const targetId = rootEl.querySelector('#tgtSelect').value;
        const chosenAttack = attackOptions[atkIdx];
        const chosenAttacker = { ...attacker, attacks: [chosenAttack] };
        const swings = Math.max(1, chosenAttack.attackCount || 1);
        closeModal();
        for (let i = 0; i < swings; i++) {
          const target = findCombatant(encounter, targetId);
          if (!target || isCombatantDown(target.hp.current)) break;
          await combatAttack(encounter, chosenAttacker, target);
        }
        await persist();
        if (await checkCombatEnd()) { render(); return; }
        render();
      };
    });
  }

  render();
}

function combatantCardHtml(c, isActive) {
  const down = isCombatantDown(c.hp.current);
  const pct = Math.max(0, Math.min(100, (c.hp.current / c.hp.max) * 100));
  return `
    <div class="card combatant-card side-${c.side} ${isActive ? 'is-active' : ''} ${down ? 'is-down' : ''}">
      <div class="row between">
        <strong>${escapeHtml(c.name)}</strong>
        <div class="row" style="gap:.3rem">
          <span class="badge ${c.side === 'party' ? '' : 'accent'}">${c.side}</span>
          ${!isActive ? `<button class="btn sm" data-set-active="${c.id}">Set Active</button>` : ''}
        </div>
      </div>
      <div class="cc-hpbar"><div class="cc-hpbar-fill ${pct <= 25 ? 'low' : ''}" style="width:${pct}%"></div></div>
      <div class="row wrap cc-inline-inputs" style="gap:.6rem">
        <label class="hint">HP <input type="number" data-hp-cur="${c.id}" value="${c.hp.current}"> / <input type="number" data-hp-max="${c.id}" value="${c.hp.max}"></label>
        <label class="hint">AC <input type="number" data-ac-val="${c.id}" value="${c.ac}"></label>
        <label class="hint">Init <input type="number" data-init-val="${c.id}" value="${c.initiativeRoll}"></label>
      </div>
      <div class="chip-list">
        ${c.conditions.map((cond, i) => `<span class="chip">${escapeHtml(cond.conditionId)}<button data-cond-remove="${c.id}|${i}">✕</button></span>`).join('') || '<span class="hint">No conditions.</span>'}
      </div>
      ${c.conditions.map(cond => getConditionReminder(cond.conditionId)).filter(Boolean).length ? `
        <p class="hint" style="margin-top:.3rem">${c.conditions.map(cond => { const r = getConditionReminder(cond.conditionId); return r ? `<strong>${escapeHtml(cond.conditionId)}:</strong> ${escapeHtml(r)}` : ''; }).filter(Boolean).join(' · ')}</p>
      ` : ''}
      <div class="list-add-row"><input type="text" data-cond-input="${c.id}" placeholder="Add condition"><button class="btn sm" data-cond-add="${c.id}">Add</button></div>
    </div>
  `;
}

            <option value="hex">Hex</option>
          </select>

      ` : ''}
      <div class="row" style="margin-top:1rem">
        <button class="btn block" id="nmCancel">Cancel</button>
        <button class="btn primary block" id="nmCreate">Create</button>
      </div>
    `, (rootEl) => {
      rootEl.querySelector('#nmCancel').onclick = closeModal;
      rootEl.querySelector('#nmCreate').onclick = async () => {

        const cols = clamp(parseInt(rootEl.querySelector('#nmCols').value) || 12, 4, 30);
        const rows = clamp(parseInt(rootEl.querySelector('#nmRows').value) || 10, 4, 30);
        const gridTypeSel = rootEl.querySelector('#nmGridType');
        const gridType = gridTypeSel ? gridTypeSel.value : 'square';
        const map = makeMap({ campaignId, name, cols, rows, gridType });
        await DB.put('maps', map);

        Router.go(`#/campaigns/${campaignId}/maps/${map.id}`);
      };
    });
  };
}

/* ---- Map view (grid board: tokens, fog of war, walls, AoE, line of sight) ---- */
async function ScreenMapView(root, campaignId, mapId) {
  let map = await DB.get('maps', mapId);
  if (!map) { root.innerHTML = emptyState('❓', 'Map not found'); return; }
  let tokens = await DB.getAllByIndex('tokens', 'mapId', mapId);
  let fogState = await getOrCreateFogState(mapId);
  const characters = await DB.getAllByIndex('characters', 'campaignId', campaignId);
  const charById = Object.fromEntries(characters.map(c => [c.id, c]));
  const activeEncounter = (await DB.getAllByIndex('encounters', 'campaignId', campaignId)).find(e => e.status === 'active');

  const CELL = map.cellSizePx;
  const isHex = map.gridType === 'hex';
  const hexSize = CELL / 1.8; // hex "radius" chosen so a hex map at the same cols/rows reads at a similar density to a square one
  let viewMode = 'dm';
  let tool = 'select';
  let aoeShape = 'circle';
  let aoeSize = 3;
  let aoeOrigin = null;
  let aoeCells = [];
  let losPoints = [];
  let selectedTokenId = null;
  let zoom = 1, panX = 20, panY = 20;
  let suppressNextClick = false;

  const blockedSet = new Set(map.blockedCells || []);
  const revealedSet = new Set(fogState.revealedCells || []);

  // Grid-type dispatch: the rest of the screen works in {x,y} cell coordinates
  // (x=q, y=r for hex maps — see DECISIONS.md D19) and calls these helpers
  // instead of the square/hex math directly, so almost nothing else in this
  // file needs to know which grid type it's drawing.
  function cellCenterPixel(cell) {
    if (isHex) return hexToPixel({ q: cell.x, r: cell.y }, hexSize);
    return { x: (cell.x + 0.5) * CELL, y: (cell.y + 0.5) * CELL };
  }
  function pixelToCell(px, py) {
    if (isHex) {
      const q = (px * Math.sqrt(3) / 3 - py / 3) / hexSize;
      const r = (py * 2 / 3) / hexSize;
      const rounded = cubeRound(q, -q - r, r);
      return { x: rounded.q, y: rounded.r };
    }
    return { x: Math.floor(px / CELL), y: Math.floor(py / CELL) };
  }
  function radiusCells(origin, radius) {
    if (isHex) return cellsInHexRadius({ q: origin.x, r: origin.y }, radius).map(c => ({ x: c.q, y: c.r }));
    return cellsInCircle(origin, radius);
  }
  // Hex has no distinct "square/cube" shape — a filled hex disk stands in for
  // it (documented simplification, D19), same as the circle shape above.
  function blockShapeCells(origin, size) {
    if (isHex) return radiusCells(origin, size);
    return cellsInSquare(origin, size);
  }
  function coneCells(origin, target, length) {
    if (isHex) return cellsInHexCone({ q: origin.x, r: origin.y }, { q: target.x, r: target.y }, length, hexSize).map(c => ({ x: c.q, y: c.r }));
    return cellsInCone(origin, target, length);
  }
  function lineCells(origin, target, length) {
    if (isHex) return cellsInHexLine({ q: origin.x, r: origin.y }, { q: target.x, r: target.y }, length).map(c => ({ x: c.q, y: c.r }));
    return cellsInLine(origin, target, length);
  }
  function checkLineOfSight(a, b) {
    if (isHex) return hasHexLineOfSight({ q: a.x, r: a.y }, { q: b.x, r: b.y }, blockedSet);
    return hasLineOfSight(a, b, blockedSet);
  }

  function cellFromClient(clientX, clientY, svgEl) {
    const rect = svgEl.getBoundingClientRect();
    const px = (clientX - rect.left - panX) / zoom;
    const py = (clientY - rect.top - panY) / zoom;
    return pixelToCell(px, py);
  }

  function movementRangeCells(token) {
    if (!token || token.refType !== 'character') return [];
    const char = charById[token.refId];
    if (!char) return [];
    const rangeInCells = Math.floor((char.speed || 30) / 5);
    return radiusCells({ x: token.x, y: token.y }, rangeInCells).concat([{ x: token.x, y: token.y }]);
  }

  function render() {
    const rangeCells = selectedTokenId ? new Set(movementRangeCells(tokens.find(t => t.id === selectedTokenId)).map(cellKey)) : new Set();
    const aoeSet = new Set(aoeCells.map(cellKey));
    const activeTokenRefId = activeEncounter ? findCombatant(activeEncounter, activeEncounter.initiativeOrder[activeEncounter.activeIndex]).refId : null;

    let cellsHtml = '';
    for (let y = 0; y < map.rows; y++) {
      for (let x = 0; x < map.cols; x++) {
        const key = `${x},${y}`;
        const isBlocked = blockedSet.has(key);
        const isRange = rangeCells.has(key);
        const isAoe = aoeSet.has(key);
        const isFogged = viewMode === 'player' && !revealedSet.has(key);
        let cls = 'map-cell';
        if (isBlocked) cls += ' blocked';
        if (isRange) cls += ' highlight-range';
        if (isAoe) cls += ' highlight-aoe';
        if (isHex) {
          const center = cellCenterPixel({ x, y });
          const points = hexCorners(center, hexSize).map(p => `${p.x},${p.y}`).join(' ');
          cellsHtml += `<polygon class="${cls}" data-cell-x="${x}" data-cell-y="${y}" points="${points}"></polygon>`;
          if (isFogged) cellsHtml += `<polygon class="map-cell fog" data-fog-cell="1" points="${points}"></polygon>`;
        } else {
          cellsHtml += `<rect class="${cls}" data-cell-x="${x}" data-cell-y="${y}" x="${x * CELL}" y="${y * CELL}" width="${CELL}" height="${CELL}"></rect>`;
          if (isFogged) cellsHtml += `<rect class="map-cell fog" data-fog-cell="1" x="${x * CELL}" y="${y * CELL}" width="${CELL}" height="${CELL}"></rect>`;
        }
      }
    }
    let tokensHtml = '';
    tokens.forEach(t => {
      const isActiveTurn = activeTokenRefId && t.refId === activeTokenRefId;
      const hiddenFromPlayer = viewMode === 'player' && t.isHiddenFromPlayer;
      if (hiddenFromPlayer) return;
      const initials = (t.name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const r = (isHex ? hexSize : CELL) * 0.4;
      const center = cellCenterPixel({ x: t.x, y: t.y });
      tokensHtml += `
        <g class="map-token ${isActiveTurn ? 'active-turn' : ''}" data-token-id="${t.id}" transform="translate(${center.x},${center.y})" style="cursor:pointer">
          ${t.imageData ? `
            <clipPath id="clip-${t.id}"><circle r="${r}"></circle></clipPath>
            <circle r="${r}" fill="${escapeHtml(t.color)}"></circle>
            <image href="${t.imageData}" x="${-r}" y="${-r}" width="${r * 2}" height="${r * 2}" clip-path="url(#clip-${t.id})" preserveAspectRatio="xMidYMid slice"></image>
          ` : `
            <circle r="${r}" fill="${escapeHtml(t.color)}"></circle>
            <text>${escapeHtml(initials)}</text>
          `}
        </g>
      `;
    });
    let losHtml = '';
    if (losPoints.length === 2) {
      const [a, b] = losPoints;
      const ok = checkLineOfSight(a, b);
      const pa = cellCenterPixel(a), pb = cellCenterPixel(b);
      losHtml = `<line class="map-los-line" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${ok ? 'var(--success)' : 'var(--danger)'}"></line>`;
    }

    root.innerHTML = `
      <div class="map-toolbar">
        <button data-tool="select" class="${tool === 'select' ? 'active' : ''}">👆 Select/Move</button>
        <button data-tool="wall" class="${tool === 'wall' ? 'active' : ''}">🧱 Walls</button>
        <button data-tool="fog" class="${tool === 'fog' ? 'active' : ''}">🌫 Fog Reveal</button>
        <button data-tool="aoe" class="${tool === 'aoe' ? 'active' : ''}">💥 AoE</button>
        <button data-tool="los" class="${tool === 'los' ? 'active' : ''}">👁 Line of Sight</button>
      </div>
      ${tool === 'aoe' ? `
        <div class="row wrap" style="margin-bottom:.6rem">
          <select id="aoeShapeSelect">
            <option value="circle" ${aoeShape === 'circle' ? 'selected' : ''}>Circle</option>
            <option value="square" ${aoeShape === 'square' ? 'selected' : ''}>Square/Cube</option>
            <option value="cone" ${aoeShape === 'cone' ? 'selected' : ''}>Cone</option>
            <option value="line" ${aoeShape === 'line' ? 'selected' : ''}>Line</option>
          </select>
          <input type="number" id="aoeSizeInput" value="${aoeSize}" min="1" max="10" style="width:4.5em">
          <button class="btn sm" id="aoeClearBtn">Clear</button>
        </div>
        <p class="hint">Circle/Square: tap origin. Cone/Line: tap origin, then tap a second cell to aim.</p>
        ${aoeCells.length ? `<button class="btn sm block" id="applyAoeEffectBtn" style="margin-bottom:.6rem">⚡ Apply Effect to ${aoeCells.length} Highlighted Cells</button>` : ''}
      ` : ''}
      <div class="row between" style="margin-bottom:.5rem">
        <div class="row" style="gap:.3rem">
          <button class="btn sm ${viewMode === 'dm' ? 'primary' : ''}" id="dmViewBtn">DM View</button>
          <button class="btn sm ${viewMode === 'player' ? 'primary' : ''}" id="playerViewBtn">Player View</button>
        </div>
        <div class="row" style="gap:.3rem">
          <button class="btn sm" id="zoomOutBtn">－</button>
          <button class="btn sm" id="zoomInBtn">＋</button>
        </div>
      </div>
      <div class="map-viewport" id="mapViewport">
        <svg width="100%" height="100%">
          <g id="mapLayer" transform="translate(${panX},${panY}) scale(${zoom})">
            ${cellsHtml}
            ${losHtml}
            ${tokensHtml}
          </g>
        </svg>
      </div>
      <button class="btn block" id="addTokenBtn" style="margin-top:.6rem">+ Add Token</button>
      <p class="hint" style="text-align:center">Drag a token to move it. Pinch or use ＋/－ to zoom. Drag empty space to pan.</p>
    `;

    wireMapEvents();
  }

  function wireMapEvents() {
    root.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { tool = b.getAttribute('data-tool'); aoeOrigin = null; aoeCells = []; losPoints = []; render(); });
    root.querySelector('#dmViewBtn').onclick = () => { viewMode = 'dm'; render(); };
    root.querySelector('#playerViewBtn').onclick = () => { viewMode = 'player'; render(); };
    root.querySelector('#zoomInBtn').onclick = () => { zoom = clamp(zoom + 0.15, 0.4, 2.5); render(); };
    root.querySelector('#zoomOutBtn').onclick = () => { zoom = clamp(zoom - 0.15, 0.4, 2.5); render(); };
    const aoeShapeSel = root.querySelector('#aoeShapeSelect');
    if (aoeShapeSel) aoeShapeSel.onchange = e => { aoeShape = e.target.value; aoeOrigin = null; aoeCells = []; render(); };
    const aoeSizeInput = root.querySelector('#aoeSizeInput');
    if (aoeSizeInput) aoeSizeInput.onchange = e => { aoeSize = parseInt(e.target.value) || 3; };
    const aoeClearBtn = root.querySelector('#aoeClearBtn');
    if (aoeClearBtn) aoeClearBtn.onclick = () => { aoeOrigin = null; aoeCells = []; render(); };
    const applyAoeBtn = root.querySelector('#applyAoeEffectBtn');
    if (applyAoeBtn) applyAoeBtn.onclick = () => openApplyEffectModal();

    root.querySelector('#addTokenBtn').onclick = () => openAddTokenModal();

    const viewport = root.querySelector('#mapViewport');
    const svgEl = root.querySelector('svg');

    // Background pan (single-pointer drag starting on empty space).
    let panStart = null;
    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.map-token') || e.target.hasAttribute('data-cell-x')) return;
      panStart = { x: e.clientX, y: e.clientY, panX, panY };
    });
    viewport.addEventListener('pointermove', (e) => {
      if (!panStart) return;
      panX = panStart.panX + (e.clientX - panStart.x);
      panY = panStart.panY + (e.clientY - panStart.y);
      const g = root.querySelector('#mapLayer');
      if (g) g.setAttribute('transform', `translate(${panX},${panY}) scale(${zoom})`);
    });
    window.addEventListener('pointerup', () => { panStart = null; }, { once: false });

    // Pinch-to-zoom (two-touch).
    let pinchStartDist = null, pinchStartZoom = null;
    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      if (pinchStartDist === null) { pinchStartDist = dist; pinchStartZoom = zoom; return; }
      zoom = clamp(pinchStartZoom * (dist / pinchStartDist), 0.4, 2.5);
      const g = root.querySelector('#mapLayer');
      if (g) g.setAttribute('transform', `translate(${panX},${panY}) scale(${zoom})`);
    }, { passive: false });
    viewport.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinchStartDist = null; });

    // Cell taps: wall/fog/aoe/los tools.
    root.querySelectorAll('[data-cell-x]').forEach(cellEl => {
      cellEl.addEventListener('click', async () => {
        const x = parseInt(cellEl.getAttribute('data-cell-x')), y = parseInt(cellEl.getAttribute('data-cell-y'));
        await handleCellTap({ x, y });
      });
    });

    // Token drag / tap-to-select.
    root.querySelectorAll('.map-token').forEach(tokenEl => {
      const tokenId = tokenEl.getAttribute('data-token-id');
      const token = tokens.find(t => t.id === tokenId);
      tokenEl.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        const startX = e.clientX, startY = e.clientY;
        let moved = false;
        function onMove(ev) {
          if (Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5) moved = true;
          if (moved) {
            const cell = cellFromClient(ev.clientX, ev.clientY, svgEl);
            const center = cellCenterPixel(cell);
            tokenEl.setAttribute('transform', `translate(${center.x},${center.y})`);
          }
        }
        async function onUp(ev) {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          if (moved) {
            const cell = cellFromClient(ev.clientX, ev.clientY, svgEl);
            token.x = clamp(cell.x, 0, map.cols - 1);
            token.y = clamp(cell.y, 0, map.rows - 1);
            await DB.put('tokens', token);
            render();
          } else {
            selectedTokenId = selectedTokenId === tokenId ? null : tokenId;
            render();
          }
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }

  async function handleCellTap(cell) {
    if (tool === 'wall') {
      const key = cellKey(cell);
      if (blockedSet.has(key)) blockedSet.delete(key); else blockedSet.add(key);
      map.blockedCells = Array.from(blockedSet);
      await DB.put('maps', map);
      render();
    } else if (tool === 'fog') {
      const key = cellKey(cell);
      if (revealedSet.has(key)) revealedSet.delete(key); else revealedSet.add(key);
      fogState.revealedCells = Array.from(revealedSet);
      await DB.put('fog_of_war_state', fogState);
      render();
    } else if (tool === 'aoe') {
      if (!aoeOrigin) {
        aoeOrigin = cell;
        if (aoeShape === 'circle') aoeCells = radiusCells(cell, aoeSize);
        else if (aoeShape === 'square') aoeCells = blockShapeCells(cell, aoeSize);
        else aoeCells = []; // cone/line need a second tap for direction
        render();
      } else {
        if (aoeShape === 'cone') aoeCells = coneCells(aoeOrigin, cell, aoeSize);
        else if (aoeShape === 'line') aoeCells = lineCells(aoeOrigin, cell, aoeSize);
        render();
      }
    } else if (tool === 'los') {
      losPoints = losPoints.length >= 2 ? [cell] : [...losPoints, cell];
      render();
    }
  }

  // Resolves each token standing in a highlighted cell to a live, damageable
  // target: an active encounter's combatant if one matches by ref, otherwise
  // the character itself (for out-of-combat effects). Monsters with no
  // matching combatant have no persistent HP to apply to and are skipped —
  // this is the map/combat "bridge" described in the Effect application feature.
  function resolveAoeTargets() {
    const cellSet = new Set(aoeCells.map(cellKey));
    const hitTokens = tokens.filter(t => cellSet.has(cellKey({ x: t.x, y: t.y })) && t.refType !== 'generic');
    return hitTokens.map(t => {
      const combatant = activeEncounter ? activeEncounter.combatants.find(c => c.refType === t.refType && c.refId === t.refId) : null;
      if (combatant) return { kind: 'combatant', token: t, combatant };
      if (t.refType === 'character') { const char = charById[t.refId]; if (char) return { kind: 'character', token: t, char }; }
      return null;
    }).filter(Boolean);
  }

  // Normalizes a resolveAoeTargets() entry into the {abilities, savingThrows,
  // level, resistances, immunities, vulnerabilities} shape saveBonusFor() and
  // applyDamageWithResistance() expect, regardless of whether it's a live
  // combatant (character or monster) or an out-of-combat character.
  function aoeEntityInfo(t) {
    const source = t.kind === 'combatant' ? t.combatant : t.char;
    return {
      abilities: source.abilities || {}, savingThrows: source.savingThrows || {}, level: source.level || 1,
      resistances: source.resistances || [], immunities: source.immunities || [], vulnerabilities: source.vulnerabilities || []
    };
  }

  function openApplyEffectModal() {
    const targets = resolveAoeTargets();
    openModal(`
      <h2>Apply Effect</h2>
      ${targets.length ? `<p class="hint">Will affect: ${targets.map(t => escapeHtml(t.token.name)).join(', ')}</p>` : `<p class="hint">No damageable tokens are standing in the highlighted cells. Place tokens first, or this will just log a note.</p>`}
      <div class="field"><label>Damage formula (optional)</label><input type="text" id="aoeDamage" placeholder="e.g. 4d6"></div>
      <div class="field"><label>Damage type (optional, for resistance/immunity/vulnerability)</label><input type="text" id="aoeDamageType" placeholder="e.g. fire"></div>
      <div class="field"><label>Heal formula (optional)</label><input type="text" id="aoeHeal" placeholder="e.g. 2d8"></div>
      <div class="field"><label>Condition to apply (optional)</label><input type="text" id="aoeCondition" placeholder="e.g. Prone" list="condSuggestListMap"></div>
      <datalist id="condSuggestListMap">${Object.keys(CONDITION_LIBRARY).map(c => `<option value="${c[0].toUpperCase() + c.slice(1)}">`).join('')}</datalist>
      <div class="row" style="gap:.5rem">
        <div class="field" style="flex:1"><label>Save DC (optional)</label><input type="number" id="aoeSaveDc" placeholder="e.g. 14"></div>
        <div class="field" style="flex:1"><label>Save ability</label><select id="aoeSaveAbility">${ABILITIES.map(a => `<option value="${a}">${a.toUpperCase()}</option>`).join('')}</select></div>
      </div>
      <p class="hint">A save DC rolls each target's own saving throw: damage is halved and the condition is skipped on a success. Leave it blank to hit everyone automatically, as before.</p>
      <div class="row" style="margin-top:1rem">
        <button class="btn block" id="aoeEffectCancel">Cancel</button>
        <button class="btn primary block" id="aoeEffectGo">Apply</button>
      </div>
    `, (rootEl) => {
      rootEl.querySelector('#aoeEffectCancel').onclick = closeModal;
      rootEl.querySelector('#aoeEffectGo').onclick = async () => {
        const dmgFormula = rootEl.querySelector('#aoeDamage').value.trim();
        const dmgType = rootEl.querySelector('#aoeDamageType').value.trim();
        const healFormula = rootEl.querySelector('#aoeHeal').value.trim();
        const condition = rootEl.querySelector('#aoeCondition').value.trim();
        const saveDc = parseInt(rootEl.querySelector('#aoeSaveDc').value) || 0;
        const saveAbility = rootEl.querySelector('#aoeSaveAbility').value;
        let baseDmg = null, healTotal = null;
        if (dmgFormula && parseDiceFormula(dmgFormula)) {
          const r = rollFormula(dmgFormula);
          baseDmg = r.total;
          await DB.put('dice_rolls', makeDiceRoll({ campaignId, formula: dmgFormula, dice: r.dice, modifier: r.modifier, total: r.total, purpose: 'AoE effect damage' }));
        }
        if (healFormula && parseDiceFormula(healFormula)) {
          const r = rollFormula(healFormula);
          healTotal = r.total;
        }
        const names = [];
        for (const t of targets) {
          const hp = t.kind === 'combatant' ? t.combatant.hp : t.char.hp;
          const info = aoeEntityInfo(t);
          let saved = false;
          if (saveDc > 0 && (baseDmg !== null || condition)) {
            const bonus = saveBonusFor(info, saveAbility, profBonusForLevel(info.level));
            const roll = rollD20(bonus, 'none');
            saved = roll.total >= saveDc;
            await DB.put('dice_rolls', makeDiceRoll({ campaignId, actorType: t.kind === 'combatant' && t.combatant.isBot ? 'bot' : 'player', actorId: t.kind === 'combatant' ? t.combatant.refId : t.char.id, formula: `1d20${bonus >= 0 ? '+' : ''}${bonus}`, dice: roll.rolls, modifier: bonus, total: roll.total, purpose: `${t.token.name} save vs DC ${saveDc}` }));
          }
          let noteParts = [];
          if (baseDmg !== null) {
            const amount = applyDamageWithResistance(saved ? Math.floor(baseDmg / 2) : baseDmg, dmgType, info);
            hp.current = clamp(hp.current - amount, 0, hp.max);
            noteParts.push(`${amount} dmg${saveDc > 0 ? (saved ? ' (saved, half)' : ' (failed save)') : ''}${resistanceMultiplier(dmgType, info) !== 1 ? ' (resisted)' : ''}`);
          }
          if (healTotal !== null) { hp.current = clamp(hp.current + healTotal, 0, hp.max); noteParts.push(`${healTotal} healing`); }
          if (condition && !saved) {
            const conditions = t.kind === 'combatant' ? t.combatant.conditions : t.char.conditions;
            conditions.push({ conditionId: condition, source: 'aoe_effect', roundsRemaining: null });
            noteParts.push(condition);
          }
          if (t.kind === 'combatant') await DB.put('encounters', activeEncounter);
          else await DB.put('characters', t.char);
          names.push(`${t.token.name} (${noteParts.join(', ') || 'no change'})`);
        }
        const summary = names.length
          ? `An area effect hits ${names.join('; ')}.`
          : `An area effect was triggered but no tokens were in range.`;
        await DB.put('log_entries', makeLogEntry({ campaignId, type: 'system', speakerType: 'system', text: summary }));
        closeModal();
        toast(names.length ? `Applied to ${names.length} target${names.length === 1 ? '' : 's'}.` : 'No targets in range.', 'success');
      };
    });
  }

  function openAddTokenModal() {
    const options = characters.map(c => ({ label: `${c.name} (${c.controlledBy})`, refType: 'character', refId: c.id, color: c.controlledBy === 'bot' ? '#6a93c4' : '#b3893f' }));
    const enemyOptions = activeEncounter ? activeEncounter.combatants.filter(c => c.side === 'enemy').map(c => ({ label: c.name, refType: 'monster', refId: c.refId, color: '#c65454' })) : [];
    const all = [...options, ...enemyOptions];
    openModal(`
      <h2>Add Token</h2>
      <div class="field">
        <label>From</label>
        <select id="tokenSourceSelect">
          ${all.map((o, i) => `<option value="${i}">${escapeHtml(o.label)}</option>`).join('')}
          <option value="generic">Generic marker…</option>
        </select>
      </div>
      <div class="field" id="genericNameField" style="display:none"><label>Name</label><input type="text" id="genericNameInput" placeholder="Marker"></div>
      <div class="field"><label>Custom image (optional)</label><input type="file" id="tokenImageInput" accept="image/*"></div>
      <div class="row"><button class="btn block" id="tokenGalleryBtn" type="button">Choose Portrait Instead…</button></div>
      <div class="row" style="margin-top:1rem">
        <button class="btn block" id="atCancel">Cancel</button>
        <button class="btn primary block" id="atAdd">Add</button>
      </div>
    `, (rootEl) => {
      const sel = rootEl.querySelector('#tokenSourceSelect');
      sel.onchange = () => { rootEl.querySelector('#genericNameField').style.display = sel.value === 'generic' ? '' : 'none'; };
      rootEl.querySelector('#atCancel').onclick = closeModal;
      let galleryImageData = null;
      rootEl.querySelector('#tokenGalleryBtn').onclick = () => {
        openPortraitGallery((dataUrl) => {
          galleryImageData = dataUrl;
          rootEl.querySelector('#tokenImageInput').value = '';
          toast('Portrait selected for this token.', 'success');
        });
      };
      rootEl.querySelector('#atAdd').onclick = async () => {
        let tokenData;
        if (sel.value === 'generic') {
          const name = rootEl.querySelector('#genericNameInput').value.trim() || 'Marker';
          tokenData = { refType: 'generic', refId: null, name, color: '#a598b3' };
        } else {
          const o = all[parseInt(sel.value)];
          tokenData = { refType: o.refType, refId: o.refId, name: o.label.split(' (')[0], color: o.color };
        }
        const imageFile = rootEl.querySelector('#tokenImageInput').files[0];
        let imageData = galleryImageData;
        if (imageFile) imageData = await new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(imageFile); });
        const token = makeToken({ campaignId, mapId, ...tokenData, x: 1, y: 1 });
        token.imageData = imageData;
        await DB.put('tokens', token);
        tokens.push(token);
        closeModal();
        render();
      };
    });
  }

  render();
}

/* ---- Settings ---- */
function getActiveTheme() {
  return localStorage.getItem('ft_theme') || 'dark_fantasy';
}
function applyTheme(themeId) {
  document.documentElement.setAttribute('data-theme', themeId);
  localStorage.setItem('ft_theme', themeId);
}

async function ScreenSettings(root) {
  const current = getActiveTheme();
  root.innerHTML = `
    <div class="section-title">Theme</div>
    <div class="theme-swatch-row">
      ${THEMES.map(t => `
        <div class="theme-swatch ${current === t.id ? 'selected' : ''}" data-theme-pick="${t.id}">
          <div class="sw-preview">${t.swatches.map(c => `<span style="background:${c}"></span>`).join('')}</div>
          ${t.label}
        </div>
      `).join('')}
    </div>
    <div class="section-title">Backup</div>
    <p class="hint">Your data lives only on this device. Export regularly — clearing browser data or reinstalling will erase everything not backed up. Full campaign export includes characters, bots, npcs, encounters, maps, tokens, fog of war, quests, journal, handouts, lore, logs, dice history, and homebrew content.</p>
    <button class="btn block" id="exportAllBtn">Export All Campaigns (full backup)</button>
    <button class="btn primary block" id="importCampaignBtn" style="margin-top:.5rem">⇧ Import Campaign (JSON)</button>
    <input type="file" id="importCampaignFile" accept="application/json" style="display:none">
    <p class="hint">Importing creates a new campaign on this device — it never overwrites existing data, even if you import the same file twice. Only import files you trust.</p>
    <div class="section-title">About</div>
    <p>FableTable Solo — a deterministic, offline, solo tabletop RPG companion. No accounts, no network calls, no language model. All bot and DM behavior is scripted.</p>
    ${disclaimerFooter()}
  `;
  root.querySelectorAll('[data-theme-pick]').forEach(el => {
    el.onclick = () => { applyTheme(el.getAttribute('data-theme-pick')); ScreenSettings(root); };
  });
  root.querySelector('#exportAllBtn').onclick = async () => {
    const campaigns = await DB.getAll('campaigns');
    if (!campaigns.length) { toast('No campaigns to export yet.', 'danger'); return; }
    const payloads = await Promise.all(campaigns.map(c => gatherCampaignExportPayload(c.id)));
    downloadJson({ formatVersion: 1, exportedAt: nowIso(), campaigns: payloads }, 'fabletable-full-backup.json');
    toast(`Exported ${campaigns.length} campaign${campaigns.length === 1 ? '' : 's'}.`, 'success');
  };
  root.querySelector('#importCampaignBtn').onclick = () => root.querySelector('#importCampaignFile').click();
  root.querySelector('#importCampaignFile').onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const ok = await showCopyrightWarning();
    if (!ok) return;
    let payload;
    try { payload = JSON.parse(await file.text()); } catch (err) { toast('Import failed: file is not valid JSON.', 'danger'); return; }
    // Support both a single-campaign export and a multi-campaign "Export All" bundle.
    const bundles = Array.isArray(payload.campaigns) && !payload.campaign ? payload.campaigns : [payload];
    let imported = 0;
    for (const bundle of bundles) {
      const errs = validateExportPayload(bundle);
      if (errs.length) { toast(`Skipped one campaign: ${errs.join(' ')}`, 'danger'); continue; }
      const remapped = remapCampaignExportIds(bundle, uid);
      await DB.put('campaigns', remapped.campaign);
      for (const [payloadKey, storeName] of Object.entries(PAYLOAD_TO_STORE)) {
        for (const row of (remapped[payloadKey] || [])) await DB.put(storeName, row);
      }
      imported++;
    }
    if (imported) toast(`Imported ${imported} campaign${imported === 1 ? '' : 's'}.`, 'success');
    Router.go('#/campaigns');
  };
}

    `;

    root.querySelectorAll('[data-entity-id]').forEach(el => el.onclick = async (e) => {
      if (e.target.closest('[data-entity-delete]')) return;
      const row = await DB.get(schema.store, el.getAttribute('data-entity-id'));
      openEntityForm(schema, row);
    });
    root.querySelectorAll('[data-entity-delete]').forEach(el => el.onclick = async (e) => {
      e.stopPropagation();
      const ok = await confirmDialog('Delete this entry?', { okLabel: 'Delete', danger: true });
      if (!ok) return;
      await DB.delete(schema.store, el.getAttribute('data-entity-delete'));
      render();
    });
    root.querySelector('#newEntityBtn').onclick = () => openEntityForm(schema, null);
    root.querySelector('#exportPackBtn').onclick = () => exportContentPack(campaignId);
    root.querySelector('#importPackBtn').onclick = () => root.querySelector('#importPackFile').click();
    root.querySelector('#importPackFile').onchange = async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      await importContentPackFile(campaignId, file);
      render();
    };
  }

  function openEntityForm(schema, existing) {
    let data = existing ? { ...existing } : schema.blank();
    if (existing && schema.onLoad) data = schema.onLoad(existing);
    data.campaignId = campaignId;

    openModal(`
      <h2>${existing ? 'Edit' : 'New'} ${escapeHtml(schema.label.replace(/s$/, ''))}</h2>
      <div id="entityFormBody"></div>
      <div class="row" style="margin-top:1rem">
        <button class="btn block" id="efCancel">Cancel</button>
        <button class="btn primary block" id="efSave">Save</button>
      </div>
    `, (rootEl) => {
      const body = rootEl.querySelector('#entityFormBody');
      body.innerHTML = schema.fields.map(f => fieldHtml(f, data[f.key])).join('');
      schema.fields.forEach(f => {
        const el = body.querySelector(`[data-field="${f.key}"]`);
        el.oninput = () => { data[f.key] = f.type === 'number' ? (parseFloat(el.value) || 0) : el.value; };
      });
      rootEl.querySelector('#efCancel').onclick = closeModal;
      rootEl.querySelector('#efSave').onclick = async () => {
        const errs = validateSchemaEntity(schema, data);
        if (errs.length) { toast(errs.join(' '), 'danger'); return; }
        let toSave = schema.onSave ? schema.onSave(data) : data;
        toSave.id = existing ? existing.id : (toSave.id || uid());
        toSave.campaignId = campaignId;
        await DB.put(schema.store, toSave);
        closeModal();
        toast('Saved.', 'success');
        render();
      };
    });
  }

  function fieldHtml(f, value) {
    if (f.type === 'select') return `
      <div class="field"><label>${escapeHtml(f.label)}</label>
        <select data-field="${f.key}">${f.options.map(o => `<option value="${o}" ${value === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
      </div>`;
    if (f.type === 'textarea') return `
      <div class="field"><label>${escapeHtml(f.label)}</label><textarea data-field="${f.key}">${escapeHtml(value || '')}</textarea></div>`;
    return `
      <div class="field"><label>${escapeHtml(f.label)}${f.required ? ' *' : ''}</label>
        <input type="${f.type === 'number' ? 'number' : 'text'}" data-field="${f.key}" value="${escapeHtml(value ?? '')}">
      </div>`;
  }

  render();
}
